 NOT_THEY_HAVE_ANY_RIVAL_OR_MURDER_TARGET_TRIGGER:0 "[CHARACTER.GetShortUIName|V] n'a #bold pas#! de [rival|E] ni de cible de [GetScheme('murder').GetTypeName] [scheme|E]"

 ### TRADITIONS
 tradition_occult_practices_name:0 "Pratiques Occultes"
 tradition_occult_practices_desc:0 "Vision de la magie comme une discipline fondée sur un savoir ésotérique. Ses adeptes croient qu'à travers l'application rigoureuse de rituels, de symboles et d'incantations tirés de savoirs interdits, on peut commander aux forces invisibles du monde. Le pouvoir n'est pas donné, il est saisi par la compréhension."
 rulers_with_witch_desc:0 "La [culture|E] n'a pas #V 5#! [rulers|E] avec le [GetTrait('witch').GetName( GetNullCharacter )] [trait|E]"
 culture_parameter_more_frequent_witch_rituals:0 "Le délai entre les [GetActivityType('activity_witch_ritual').GetName] [activities|E] est #P réduit#! de #V 1#! an"
 culture_parameter_easier_to_convert_witch:0 "Les [characters|E] de cette [culture|E] sont plus faciles à $convert_to_witchcraft_interaction$"
 culture_parameter_witch_trait_more_valued:3 "Le [GetTrait('witch').GetName( GetNullCharacter )] [trait|E] est considéré comme [prestige_i][prestigious|E]\n$EFFECT_LIST_BULLET$Organiser un [GetActivityType('activity_witch_ritual').GetName] rapporte du [prestige_i][prestige|E]"
 easier_to_convert_witch_name:0 "#V [GetCultureTradition('tradition_occult_practices').GetName]#! [tradition|E]"
 easier_to_convert_witch_desc:0 "[GetCultureTradition('tradition_occult_practices').GetName] [tradition|E]: $VALUE|0=-+$"

 tradition_folk_healers_name:0 "Guérisseurs Populaires"
 tradition_folk_healers_desc:0 "Certains croient que la véritable guérison vient de l'union de la terre et de l'esprit. La connaissance des herbes répare la chair, mais seule la sagesse des anciennes voies peut apaiser une âme troublée ou conjurer les maux invisibles. Les guérisseurs les plus respectés sont donc ceux qui marchent sur les deux sentiers, mêlant médecine pratique et magie profonde de la nature."
 no_witch_healer_in_realm:0 "Vous devez avoir au moins un [vassal|E], [courtier|E] ou [councillor|E] possédant les [GetTrait('witch').GetName( GetNullCharacter )] et [GetTrait('lifestyle_herbalist').GetName( GetNullCharacter )] [traits|E]"
 culture_parameter_can_appoint_court_alchemist:0 "[GetPlayer.Custom('FolkHealersAlchemistCustomLoc')][GetPlayer.Custom('FolkHealersHerbalistCustomLoc')]"
 culture_parameter_easier_herbalist_trait_gain_from_rite:0 "Le [GetTrait('lifestyle_herbalist').GetName( GetNullCharacter )] [trait|E] est plus facile à gagner lors de l'[GetActivityType('activity_witch_ritual').GetName] [activity|E]"
 culture_parameter_can_gain_mystic_trait_from_rite:0 "Peut gagner le [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )] [trait|E] en participant à l'[GetActivityType('activity_witch_ritual').GetName] [activity|E]"
 can_appoint_court_herbalist: "\n$EFFECT_LIST_BULLET$Peut nommer le [court_position|E] [GetCourtPositionType( 'court_herbalist_court_position' ).GetName()]"
 can_appoint_court_alchemist: "Peut nommer le [court_position|E] [GetCourtPositionType( 'court_alchemist_court_position' ).GetName()]"
 culture_parameter_slightly_cheaper_court_physician: "[GetCourtPositionType('court_physician_court_position').GetName()] coûte légèrement moins cher à embaucher"

 not_spiritual_communal_or_bureaucratic_desc:0 "La [culture|E] n'a pas l'[ethos|E] $ethos_spiritual_name$, $ethos_communal_name$ ou $ethos_bureaucratic_name$"
 lacks_higher_piety_level_desc:1 "Votre [piety_level|E] n'est pas [GetModifier( 'piety_level_4' ).GetNameWithTooltip|L] ou plus élevé"

 tradition_coven_kinship_name:0 "Parenté de Coven"
 tradition_coven_kinship_desc:0 "Les sorcières sont liées par les liens familiaux. Pour le coven, le clan, la lignée est tout."
 culture_parameter_convert_to_witch_close_family_super_bonus: "$convert_to_witchcraft_interaction$ sur les membres de [close_family|E] #P réussit presque toujours#!"
 convert_to_witch_close_family_super_bonus_name: "#V [GetCultureTradition('tradition_coven_kinship').GetName]#! [tradition|E]"
 convert_to_witch_close_family_super_bonus_desc: "[GetCultureTradition('tradition_coven_kinship').GetName] [tradition|E]: $VALUE|0=-+$"
 culture_parameter_more_grand_rite_guest_join_chance:0 "Augmente l'acceptation d'[activity_guests|E] pour rejoindre l'[GetActivityType('activity_witch_ritual').GetName] [activity|E]"
 more_grand_rite_guest_join_chance_desc: "[GetCultureTradition('tradition_coven_kinship').GetName] [tradition|E]: $VALUE|0=-+$"

 tradition_blessed_protection_name:0 "Protection Bénie"
 tradition_blessed_protection_desc:0 "Les soldats marchent au combat ceints de charmes et de protections, se fiant aux pouvoirs invisibles pour les protéger de la lame et de la flèche. Pour eux, la victoire ne se gagne pas seulement par l'acier, mais par les bénédictions portées sur leur personne."

 tradition_coven_meet_name:0 "Réunions de Coven"
 tradition_coven_meet_desc:0 "Le pouvoir n'est pas lié à la lignée seule, mais au conseil secret des sorcières qui se rassemblent en cercles d'ombres. Par des marchés chuchotés et des serments rituels, les dirigeants sont choisis par le coven, leur autorité sanctifiée par consensus occulte plutôt que par simple héritage."
 culture_parameter_coven_elective_enabled:0 "Peut promulguer la [GetLaw('coven_elective_succession_law').GetName] [succession_law|E]"
 culture_parameter_negate_diplomacy_penalty_for_witch_trait:0 "Supprime la pénalité de compétence [diplomacy|E] du [GetTrait('witch').GetName( GetNullCharacter )] [trait|E]"

### ACTIVITY OPTIONS
 rite_ceremony_conditional_minor_prestige_loc:0 "\n$EFFECT_LIST_BULLET$ Gain mineur de [prestige_i][prestige|E]"
 rite_ceremony_conditional_moderate_prestige_loc:0 "\n$EFFECT_LIST_BULLET$ Gain accru de [prestige_i][prestige|E]"
 rite_ceremony_conditional_major_prestige_loc:0 "\n$EFFECT_LIST_BULLET$ Gain grandement accru de [prestige_i][prestige|E]"
 rite_option_ceremony:0 "Cérémonials"
 rite_ceremony_bad:0 "Cérémonials Humble"
 rite_ceremony_bad_desc:0 "$EFFECT_LIST_BULLET$ Petit gain d'[opinion|E] avec les invités\n$EFFECT_LIST_BULLET$ Petite perte de [stress_loss_i|E][stress|E][GetPlayer.Custom('WillGetMinorPrestigeCustomLoc')][GetPlayer.Custom('WillGetMinorPietyCustomLoc')]\n\n#weak Le rite n'est pas un spectacle pour les profanes. Nous nous réunirons en secret, nos outils humbles et nos voix basses, car le vrai pouvoir réside dans la communion silencieuse des fidèles.#!"
 rite_ceremony_normal:0 "Cérémonials Dignes"
 rite_ceremony_normal_desc:0 "$EFFECT_LIST_BULLET$ Gain modéré d'[opinion|E] avec les invités\n$EFFECT_LIST_BULLET$ Perte modérée de [stress_loss_i|E][stress|E][GetPlayer.Custom('WillGetModeratePrestigeCustomLoc')][GetPlayer.Custom('WillGetModeratePietyCustomLoc')]\n\n#weak Les anciens pouvoirs méritent leur dû, et nos traditions doivent être honorées avec révérence. Nous nous procurerons les bons réactifs et préparerons l'espace sacré, car un rite fait avec respect est un rite de véritable pouvoir.#!"
 rite_ceremony_good:0 "Cérémonials Extravagants"
 rite_ceremony_good_desc:0 "$EFFECT_LIST_BULLET$ Grand gain d'[opinion|E] avec les invités\n$EFFECT_LIST_BULLET$ Grande perte de [stress_loss_i|E][stress|E][GetPlayer.Custom('WillGetMajorPrestigeCustomLoc')][GetPlayer.Custom('WillGetMajorPietyCustomLoc')]\n\n#weak Aucune dépense ne sera épargnée ; les artefacts les plus rares seront notre focus, les offrandes les plus puissantes notre tribut. Que ce Grand Rite soit le témoignage de notre ambition, une cérémonie si grandiose que les étoiles elles-mêmes en seront témoins.#!"

 GENERIC_DONT_STACK:0 "#Weak  (ne s'empile pas)#!"

# DOCTRINES
 doctrine_witchcraft_worshipped_name:0 "Vénérée"
 doctrine_witchcraft_worshipped_desc:0 "Le véritable pouvoir ne se trouve pas dans la solitude, mais dans la volonté partagée du coven. Nous croyons que notre force est multipliée lorsque nous nous rassemblons, et que nos rites les plus sacrés nous lient comme une famille spirituelle."
 # From submod tenet
 doctrine_parameter_piety_from_witch_coven_active:1 "Organiser un [GetActivityType('activity_witch_ritual').GetName] rapporte [piety_i][piety|E]"
 doctrine_parameter_shorten_witch_coven_cooldown_active:1 "Le délai entre les [GetActivityType('activity_witch_ritual').GetName] [activities|E] est #P réduit#! de #V 1#! an"
 rite_ceremony_conditional_minor_piety_loc:0 "\n$EFFECT_LIST_BULLET$ Petit gain de [piety_i][piety|E]"
 rite_ceremony_conditional_moderate_piety_loc:0 "\n$EFFECT_LIST_BULLET$ Gain accru de [piety_i][piety|E]"
 rite_ceremony_conditional_major_piety_loc:0 "\n$EFFECT_LIST_BULLET$ Gain grandement accru de [piety_i][piety|E]"
# DOCTRINE PARAMETERS AND OPINIONS (WITCHCRAFT FAITHS)
 doctrine_parameter_witchcraft_rejecting_faiths:0 "Sorcellerie Criminelle ou Réprouvée [faiths|E]"
 doctrine_parameter_witchcraft_worshipped_faiths:0 "Sorcellerie Vénérée [faiths|E]"
 doctrine_parameter_witchcraft_worshipped_faiths_opinion_active:0 "$VALUE|+=0$ [opinion|E] avec les [faiths|E] où la Sorcellerie est Vénérée"
 doctrine_parameter_witchcraft_rejecting_faiths_opinion_active:0 "$VALUE|+=0$ [opinion|E] avec les [faiths|E] où la Sorcellerie est Criminelle ou  Réprouvée"
 witchcraft_rejecting_faiths_opinion_name:0 "[faiths|E] Rejetant la Sorcellerie [opinion|E]"
 witchcraft_rejecting_faiths_county_opinion_name:0 "$witchcraft_rejecting_faiths_opinion_name$"
 witchcraft_worshipped_faiths_opinion_name:0 "[faiths|E] où la Sorcellerie est Vénérée [opinion|E]"
 witchcraft_worshipped_faiths_county_opinion_name:0 "$witchcraft_worshipped_faiths_opinion_name$"

### BREW OPTION
 rite_option_brew:0 "Breuvage"
 rite_brew_none:0 "Aucun breuvage"
 rite_brew_none_desc:0 "$EFFECT_LIST_BULLET$ Aucun coût, aucun effet\n\n#weak Seulement le feu, le cercle et les mots. Certains rites n'ont besoin de rien d'autre.#!"
 rite_brew_tea:0 "Tisane légère"
 rite_brew_tea_desc:0 "$EFFECT_LIST_BULLET$ Accorde une résistance durable aux maladies et [epidemic_resistance|E] après le rite\n\n#weak Une infusion chaude d'achillée, d'écorce de saule et de miel. Rien de mystique, mais les guérisseurs populaires ne jurent que par elle.#!"
 rite_brew_strong:0 "Breuvage hallucinogène puissant"
 rite_brew_strong_desc:0 "$EFFECT_LIST_BULLET$ Peut guérir une [illness|E] ou améliorer votre [health|E]\n$EFFECT_LIST_BULLET$ Peut aussi aggraver votre état\n\n#weak Jusquiame, champignons et racines amères, bouillis jusqu'à ce que le monde tangue. Nul ne sait comment il agira sur vous.#!"
 witch_brew_tea_modifier:0 "Tisane"
 witch_brew_tea_modifier_desc:0 "La tisane chaude a fortifié votre corps contre la [illness|E]."
 witch_brew_vigor_modifier:0 "Fortifié par le breuvage"
 witch_brew_vigor_modifier_desc:0 "Le breuvage puissant a amélioré votre [health|E] : pouls ferme et esprit clair."
 witchimproved.1010.t:0 "Une tasse partagée"
 witchimproved.1010.desc:0 "Des herbes infusent dans un pot d'argile sur les braises : achillée, thym, écorce de saule et miel pour adoucir l'amertume. Les tasses circulent en silence dans le cercle. Rien de mystique ne se produit, seulement de la chaleur et un calme qui s'installe dans votre poitrine. Les vieux guérisseurs jurent que celui qui en boit à la fin d'un rite ne tombe pas facilement malade dans les années qui suivent."
 witchimproved.1010.helper.desc:0 "\n\n[SCOPE.sC('brew_helper').GetTitledFirstName] a mesuré chaque brin à la main et hoche la tête avec une satisfaction discrète tandis que vous finissez votre tasse."
 witchimproved.1010.a:0 "À la santé."
 witchimproved.1011.t:0 "La fièvre tombe"
 witchimproved.1011.desc:0 "Le breuvage est épais, infect et amer, et les visions viennent avec force : des formes dans la lueur du feu, des voix dans l'obscurité, le sol qui tangue comme un navire. Vous transpirez toute la nuit jusqu'à être trempé. À l'aube, la maladie qui vous tenait a disparu. Les herbes, la sueur de la fièvre ou la simple croyance : vous ne sauriez le dire."
 witchimproved.1011.helper.desc:0 "\n\n[SCOPE.sC('brew_helper').GetTitledFirstName] a veillé à votre chevet, épongeant votre front et comptant vos souffles jusqu'à ce que le pire soit passé."
 witchimproved.1011.a:0 "Peu importe la cause, la maladie a cédé."
 witchimproved.1011.tt:0 "Vous êtes guéri de votre [illness|E] soignable la plus grave"
 witchimproved.1012.t:0 "L'esprit clair"
 witchimproved.1012.helper.desc:0 "\n\n[SCOPE.sC('brew_helper').GetTitledFirstName] a veillé à votre chevet, épongeant votre front et comptant vos souffles jusqu'à ce que le pire soit passé."
 witchimproved.1012.a:0 "Les forces reviennent."
 witch_brew_recovery_modifier:0 "Réchauffé par le breuvage"
 witch_brew_recovery_modifier_desc:0 "Le breuvage puissant ne vous a pas guéri, mais il a un peu amélioré votre [health|E]."
 witch_brew_sickness_modifier:0 "Malade du breuvage"
 witch_brew_sickness_modifier_desc:0 "Le breuvage puissant a aggravé votre état et nui à votre [health|E]."
 witch_brew_failed_opinion:0 "Breuvage raté"
 witchimproved.1013.desc:0 "Le breuvage est épais, infect et amer, et les visions viennent avec force. Vous transpirez toute la nuit, mais à l'aube la maladie est toujours là. Pourtant votre esprit est clair, votre pouls fort, et pour un temps votre corps se sent capable de se battre."
 witchimproved.1012.desc:0 "Le breuvage est épais, infect et amer, et les visions viennent avec force. Vous transpirez toute la nuit et vous vous réveillez à l'aube épuisé mais étrangement léger, le pouls fort et l'esprit clair. Pendant un temps, votre corps semble neuf."
 witchimproved.1013.helper.desc:0 "\n\n[SCOPE.sC('brew_helper').GetTitledFirstName] a veillé à votre chevet, épongeant votre front et comptant vos souffles jusqu'à ce que le pire soit passé."
 witchimproved.1013.t:0 "Une force fragile"
 witchimproved.1013.a:0 "Un peu de force vaut mieux que rien."
 witchimproved.1014.t:0 "Le breuvage tourne mal"
 witchimproved.1014.sick.desc:0 "Le breuvage est épais, infect et amer, et les visions viennent avec force, puis tournent : les formes dans la lueur du feu se resserrent, les voix deviennent des cris, et le sol refuse de rester immobile. Vous êtes malade toute la nuit, et à l'aube la maladie vous tient plus fermement qu'avant."
 witchimproved.1014.healthy.desc:0 "Le breuvage est épais, infect et amer, et les visions viennent avec force, puis tournent : les formes dans la lueur du feu se resserrent, les voix deviennent des cris, et le sol refuse de rester immobile. Vous êtes malade toute la nuit et vous vous réveillez à l'aube pâle, tremblant et vidé."
 witchimproved.1014.helper.desc:0 "\n\n[SCOPE.sC('brew_helper').GetTitledFirstName] a fait tout ce qui était possible, mais les dégâts sont évidents. Des mots durs sont échangés dans la lumière grise, et [SCOPE.sC('brew_helper').GetTitledFirstName] s'en va d'un regard froid, vous reprochant d'avoir exigé une dose si forte."
 witchimproved.1014.a:0 "Le prix d'un tel pouvoir."
