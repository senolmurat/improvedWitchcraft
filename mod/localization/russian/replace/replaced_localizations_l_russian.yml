 culture_parameter_close_family_better_court_positions: "[aptitude|E] [Concept( 'close_family', 'близких родственников' )|E] к [Concept( 'court_position', 'работе при дворе' )|E]: #P +20#![GetPlayer.Custom('CloseFamilyBetterCourtPositionsCustomLoc')]"
 activity_witch_ritual_selection_tooltip:0 "Поклониться божеству по имени [GetPlayer.GetFaith.WitchGodName] и принять [GetPlayer.GetFaith.WitchGodHerHis|U] темный дар\n\nОжидаемые награды:\n$BULLET_WITH_TAB$[opinion_i] [Concept( 'opinion', 'Мнение' )|E]\n$BULLET_WITH_TAB$Потеря [stress_loss_i] [Concept( 'stress', 'стресса' )|E]\n$BULLET_WITH_TAB$Опыт черты [trait|E]: [GetTrait('witch').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$Награда за выбранное намерение: дар, очко таланта или [lifestyle_experience|E], либо порча на врага\n$BULLET_WITH_TAB$Возможны [prestige_i][prestige|E] или [piety_i][piety|E] благодаря вашей культуре и вере\n$BULLET_WITH_TAB$Опции могут принести исцеление, прибавку ([health|E]) или [epidemic_resistance|E]"
 activity_witch_ritual_predicted_cost:0 "Стоимость [GetActivityType( 'activity_witch_ritual' ).GetNameNoTooltip] — это фиксированный взнос плюс стоимость выбранной церемонии и отвара. Показана средняя сумма по всем опциям с учётом ранга титула и эпохи"
 activity_witch_ritual_host_desc:1 "$BULLET_WITH_TAB$Рост [opinion_i] [opinion|E] у гостей и снижение [stress_loss_i] [stress|E] у вас, в зависимости от церемонии\n$BULLET_WITH_TAB$Опыт черты [trait|E]: [GetTrait('witch').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$Награда за намерение: дар, очко таланта или [lifestyle_experience|E], либо порча на врага\n$BULLET_WITH_TAB$Можно завести новых друзей или освоить черту [trait|E] ([lifestyle|E]) на собрании\n$BULLET_WITH_TAB$Ваш отвар может излечить болезнь ([illness|E]), улучшить здоровье ([health|E]) или дать [epidemic_resistance|E]\n$BULLET_WITH_TAB$Возможен прирост [prestige_i][prestige|E] или [piety_i][piety|E]"
