 ### TRADITIONS
 tradition_occult_practices_name:0 "Praktyki Okultystyczne"
 tradition_occult_practices_desc:0 "Postrzeganie magii jako dyscypliny zakorzenionej w wiedzy ezoterycznej. Jej wyznawcy wierzą, że poprzez staranne stosowanie rytuałów, symboli i inkantacji z zakazanej wiedzy można posiąść kontrolę nad niewidzialnymi siłami świata. Moc nie jest dana, jest zdobywana przez zrozumienie."
 rulers_with_witch_desc:0 "Ta [culture|E] nie ma #V 5#! [rulers|E] z [GetTrait('witch').GetName( GetNullCharacter )] [trait|E]"
 culture_parameter_more_frequent_witch_rituals:0 "Przerwa między [GetActivityType('activity_witch_ritual').GetName] [activities|E] jest #P zmniejszona#! o #V 1#! rok"
 culture_parameter_easier_to_convert_witch:0 "[characters|E] tej [culture|E] łatwiej przekonać poprzez $convert_to_witchcraft_interaction$"
 culture_parameter_witch_trait_more_valued:3 "[GetTrait('witch').GetName( GetNullCharacter )] [trait|E] jest postrzegana jako [prestige_i][prestigious|E]\n$EFFECT_LIST_BULLET$Organizacja [GetActivityType('activity_witch_ritual').GetName] przynosi [prestige_i][prestige|E]"
 easier_to_convert_witch_name:0 "#V [GetCultureTradition('tradition_occult_practices').GetName]#! [tradition|E]"
 easier_to_convert_witch_desc:0 "[GetCultureTradition('tradition_occult_practices').GetName] [tradition|E]: $VALUE|0=-+$"

 tradition_folk_healers_name:0 "Ludowi Uzdrowiciele"
 tradition_folk_healers_desc:0 "Są tacy, którzy wierzą, że prawdziwe uzdrowienie pochodzi z jedności ziemi i ducha. Wiedza o ziołach leczy ciało, ale tylko mądrość dawnych ścieżek koi niespokojną duszę i odpiera niewidzialne zarazy. Najbardziej szanowani uzdrowiciele kroczą obiema drogami, łącząc praktyczną medycynę z głęboką magią natury."
 no_witch_healer_in_realm:0 "Musisz mieć przynajmniej jednego [vassal|E], [courtier|E] lub [councillor|E] z [GetTrait('witch').GetName( GetNullCharacter )] i [GetTrait('lifestyle_herbalist').GetName( GetNullCharacter )] [traits|E]"
 culture_parameter_can_appoint_court_alchemist:0 "[GetPlayer.Custom('FolkHealersAlchemistCustomLoc')][GetPlayer.Custom('FolkHealersHerbalistCustomLoc')]"
 culture_parameter_easier_herbalist_trait_gain_from_rite:0 "[GetTrait('lifestyle_herbalist').GetName( GetNullCharacter )] [trait|E] łatwiej uzyskać podczas [GetActivityType('activity_witch_ritual').GetName] [activity|E]"  
 culture_parameter_can_gain_mystic_trait_from_rite:0 "Można uzyskać [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )] [trait|E] podczas [GetActivityType('activity_witch_ritual').GetName] [activity|E]"
 can_appoint_court_herbalist: "\n$EFFECT_LIST_BULLET$Można mianować [GetCourtPositionType( 'court_herbalist_court_position' ).GetName()] jako [court_position|E]"
 can_appoint_court_alchemist: "Można mianować [GetCourtPositionType( 'court_alchemist_court_position' ).GetName()] jako [court_position|E]"
 culture_parameter_slightly_cheaper_court_physician: "[GetCourtPositionType('court_physician_court_position').GetName()] kosztuje nieco mniej do zatrudnienia"

 not_spiritual_communal_or_bureaucratic_desc:0 "Ta [culture|E] nie ma [ethos|E] $ethos_spiritual_name$, $ethos_communal_name$ lub $ethos_bureaucratic_name$"
 lacks_higher_piety_level_desc:1 "Twój [piety_level|E] nie jest [GetModifier( 'piety_level_4' ).GetNameWithTooltip|L] lub wyższy"

 tradition_coven_kinship_name:0 "Pokrewieństwo Zakonu"
 tradition_coven_kinship_desc:0 "Czarownice są związane więzami rodzinnymi—dla zakonu, klan, linia krwi to wszystko."
 culture_parameter_convert_to_witch_close_family_super_bonus: "$convert_to_witchcraft_interaction$ na członków [close_family|E] prawie zawsze #P się powiedzie#!"
 convert_to_witch_close_family_super_bonus_name: "#V [GetCultureTradition('tradition_coven_kinship').GetName]#! [tradition|E]"
 convert_to_witch_close_family_super_bonus_desc: "[GetCultureTradition('tradition_coven_kinship').GetName] [tradition|E]: $VALUE|0=-+$"
 culture_parameter_more_grand_rite_guest_join_chance:0 "Zwiększa akceptację [activity_guests|E] do dołączenia do [GetActivityType('activity_witch_ritual').GetName] [activity|E]"
 more_grand_rite_guest_join_chance_desc: "[GetCultureTradition('tradition_coven_kinship').GetName] [tradition|E]: $VALUE|0=-+$"

 tradition_blessed_protection_name:0 "Błogosławiona Ochrona"
 tradition_blessed_protection_desc:0 "Żołnierze maszerują do bitwy przepasani amuletami i ochronami, ufając niewidzialnym mocom, że ochronią ich przed ostrzem i strzałą. Dla nich zwycięstwo nie jest wygrane tylko stalą, ale błogosławieństwami noszonymi na sobie."

 tradition_coven_meet_name:0 "Spotkania Zakonu"
 tradition_coven_meet_desc:0 "Władza nie jest związana tylko z linią krwi, ale z tajną radą czarownic, które zbierają się w kręgach cieni. Przez szeptane układy i rytualne przysięgi władcy są wybierani przez zakon, ich autorytet uświęcony przez okultystyczny konsensus, a nie zwykłe dziedziczenie."
 culture_parameter_coven_elective_enabled:0 "Może ustanowić [GetLaw('coven_elective_succession_law').GetName] [succession_law|E]"
 culture_parameter_negate_diplomacy_penalty_for_witch_trait:0 "Usuwa karę umiejętności [diplomacy|E] z [GetTrait('witch').GetName( GetNullCharacter )] [trait|E]"

 ### ACTIVITY OPTIONS
 rite_ceremony_conditional_minor_prestige_loc:0 "\n$EFFECT_LIST_BULLET$ Niewielki zysk [prestige_i][prestige|E]"
 rite_ceremony_conditional_moderate_prestige_loc:0 "\n$EFFECT_LIST_BULLET$ Zwiększony zysk [prestige_i][prestige|E]"
