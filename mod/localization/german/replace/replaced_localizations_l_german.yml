l_german:
 culture_parameter_close_family_better_court_positions: "[court_position|E]-[aptitude|E] für Mitglieder der [Concept('close_family', 'nahen Verwandtschaft')|E]: #P +20#![GetPlayer.Custom('CloseFamilyBetterCourtPositionsCustomLoc')]"
 activity_witch_ritual_selection_tooltip:0 "Huldigt [GetPlayer.GetFaith.WitchGodName] und nehmt das dunkle Geschenk an.\n\nErwartete Belohnungen:\n$BULLET_WITH_TAB$[opinion_i] [opinion|E]\n$BULLET_WITH_TAB$[stress_loss_i] [Concept('stress', 'Anspannungsabbau')|E]\n$BULLET_WITH_TAB$Erfahrung der [trait|E] [GetTrait('witch').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$Eine Belohnung für Euer gewähltes Vorhaben: eine Gabe, ein Perk-Punkt oder [lifestyle_experience|E], oder ein Fluch auf einen Feind\n$BULLET_WITH_TAB$Möglich: [prestige_i][prestige|E] oder [piety_i][piety|E] durch Eure Kultur und Euren Glauben\n$BULLET_WITH_TAB$Optionen können eine Heilung, einen [health|E]-Bonus oder [epidemic_resistance|E] bringen"
 activity_witch_ritual_predicted_cost:0 "Die Kosten eines [GetActivityType( 'activity_witch_ritual' ).GetNameNoTooltip] bestehen aus einer festen Gebühr plus den Kosten der gewählten Zeremonie und des Gebräus. Angezeigt wird der Durchschnitt über alle Optionen, skaliert nach Eurem Titelrang und der Epoche"
 activity_witch_ritual_host_desc:1 "$BULLET_WITH_TAB$Zuwachs an [opinion_i] [opinion|E] bei den Gästen und [stress_loss_i] [stress|E]-Abbau für Euch, je nach Zeremonie\n$BULLET_WITH_TAB$Erfahrung der [trait|E] [GetTrait('witch').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$Eine Belohnung für Euer Vorhaben: eine Gabe, ein Perk-Punkt oder [lifestyle_experience|E], oder ein Fluch auf einen Feind\n$BULLET_WITH_TAB$Ihr könnt neue Freunde gewinnen oder bei der Zusammenkunft ein [lifestyle|E]-[trait|E] erlernen\n$BULLET_WITH_TAB$Euer Gebräu kann eine [illness|E] heilen, Eure [health|E] steigern oder [epidemic_resistance|E] verleihen\n$BULLET_WITH_TAB$Möglicher Gewinn von [prestige_i][prestige|E] oder [piety_i][piety|E]"
