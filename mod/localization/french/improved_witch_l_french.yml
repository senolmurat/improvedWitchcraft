l_french:
 ### INTENTS
 blessing_intent:0 "Chercher une Bénédiction"
 blessing_intent_desc:0 "Apprenez auprès des membres les plus doués du cercle.\n$EFFECT_LIST_BULLET$Choisissez un maître et obtenez une faveur temporaire dans son domaine le plus fort\n$EFFECT_LIST_BULLET$Sa durée dépend de votre [learning_skill|E], de votre maître, du déroulement du rite et de votre expérience de la sorcellerie\n$EFFECT_LIST_BULLET$La faveur d'un invité dure moitié moins longtemps que celle de l'hôte"
 curse_enemy_intent:0 "Maudire un Ennemi"
 curse_enemy_intent_desc:0 "Canalisez des énergies malveillantes pour maudire vos ennemis et rivaux de malchance et de faiblesse.\n$EFFECT_LIST_BULLET$Peut coûter [piety_i][piety|E]\n$EFFECT_LIST_BULLET$Le maléfice peut échouer, se retourner contre vous ou être attribué à votre main."

 forbidden_knowledge_intent:0 "Chercher un Savoir Interdit"
 forbidden_knowledge_intent_desc:0 "Plongez dans des grimoires interdits pour acquérir un savoir défendu et de la sagesse. C'est risqué et pas pour les âmes faibles.\n$EFFECT_LIST_BULLET$Vous pourriez gagner un point d'atout ou de l'[lifestyle_experience|E] dans votre [lifestyle|E].\n$EFFECT_LIST_BULLET$Vous pourriez gagner des [trait|E]s négatifs.\n$EFFECT_LIST_BULLET$Vous #bold gagnerez#! du [stress_gain_i|E] [stress|E].\n$BULLET_WITH_TAB$Les personnages [GetTrait('craven').GetName( GetNullCharacter )] ou [GetTrait('paranoid').GetName( GetNullCharacter )] gagneront du [stress|E] supplémentaire.\n$EFFECT_LIST_BULLET$Une [learning_skill|E] élevée, l'expérience de la sorcellerie, un rite bien mené et un invité érudit améliorent vos chances."

 ### EVENTS
 witchimproved.1001.t:0 "Chercher une Bénédiction"
 witchimproved.1001.desc:0 "La cérémonie terminée, le cercle se défait en petits groupes de conversation. Voilà le vrai don d'un coven : non pas des esprits ou des présages, mais des gens qui savent des choses et veulent bien les partager. Une nuit passée auprès de la bonne personne peut enseigner plus qu'une année de livres."
 witchimproved.1001.a:0 "Demander à [health_expert.GetFirstNameNoTooltip] comment garder un corps robuste."
 witchimproved.1001.teacher_1:0 "Demander à [blessing_teacher_1.GetFirstNameNoTooltip] de m’instruire sur l’art"
 witchimproved.1001.teacher_2:0 "Demander à [blessing_teacher_2.GetFirstNameNoTooltip] de m’instruire sur l’art"
 witchimproved.1001.teacher_3:0 "Demander à [blessing_teacher_3.GetFirstNameNoTooltip] de m’instruire sur l’art"
 witchimproved.1001.great.t:0 "La leçon s'ancre profondément"
 witchimproved.1001.normal.t:0 "Une leçon utile"
 witchimproved.1001.poor.t:0 "Il n'en reste pas grand-chose"
 witchimproved.1001.boon.t:0 "La nuit laisse sa marque"
 witchimproved.1001.already.tt:0 "Vous portez déjà cette faveur, et la leçon d'un invité n'y ajoute rien"
 witchimproved.1002.t:0 "Maudire Votre Ennemi"
 witchimproved.1002.desc.start:0 "La pièce est saturée d'encens, la fumée s'enroulant comme des serpents fantomatiques tandis que les chants de vos fidèles réunis montent en un chœur frénétique. Les ombres dansent sur les murs, s'étirant en formes grotesques qui semblent presque vivantes.\n\n"
 witchimproved.1002.desc.mid:0 "Au centre, l'offrande brûle : du sang, des herbes et un fragment de votre propre volonté, sacrifiés aux puissances invisibles qui entendent votre appel. Le voile entre les mondes tremble — et vous ressentez une terrible clarté.\n\n"
 witchimproved.1002.desc.end:0 "Ce soir, le rite exige une victime. Une âme, un destin, à tordre et à ruiner par votre malice."
 witchimproved.1002.a:0 "Que l'esprit de [target.GetHerHis] s'effondre sous le poids du désespoir."
 witchimproved.1002.b:0 "Que la maladie ronge la chair de [target.GetHerHis] jusqu'à ce qu'[target.GetSheHe] s'effondre."
 witchimproved.1002.c:0 "Une malédiction sur la terre de [target.GetHerHis], que la peste étouffe son peuple."
 witchimproved.1002.duel.success:0 "Le maléfice est bien posé"
 witchimproved.1002.duel.failure:0 "Le maléfice tourne mal"
 witchimproved.1002.success.tt:0 "Le maléfice s'empare de [target.GetTitledFirstName] en quelques semaines"
 witchimproved.1002.failure.tt:0 "Le maléfice n'aboutit à rien, ou se retourne contre vous"
 witchimproved.1002.discovery.tt:0 "[target.GetTitledFirstName] pourrait apprendre qui en est l'auteur"
 witchimproved.1002.b.ill.tt:0 "[target.GetTitledFirstName] pourrait aussi tomber malade"
 witchimproved.1002.c.tt:0 "Une maladie éclate dans la capitale de [target.GetTitledFirstName]"
 witchimproved.1002.c.spread.tt:0 "Elle peut se propager au-delà de la capitale, jusque dans vos propres terres"
 witchimproved.1002.murder.tt:0 "Si le maléfice prend, votre complot pour assassiner [target.GetTitledFirstName] a plus de chances de réussir"
 witchimproved.1003.success.t:0 "Votre maléfice prend"
 witchimproved.1003.fizzle.t:0 "Votre maléfice n'aboutit à rien"
 witchimproved.1003.backfire.t:0 "Votre maléfice se retourne contre vous"
 witchimproved.1003.target.despair.t:0 "Le bruit court qu'on vous a jeté un sort"
 witchimproved.1003.target.sickness.t:0 "Un mal étrange s'empare de vous"
 witchimproved.1003.discovered.t:0 "[target.GetTitledFirstName] apprend que le maléfice venait de vous"
 witchimproved.1003.target.discovered.t:0 "[hexer.GetTitledFirstName] vous a fait jeter un sort"
 witchimproved.1005.t:0 "Choisir sa victime"
 witchimproved.1005.desc:0 "Le cercle attend. Un maléfice a besoin d'un nom, et ceux qui vous ont fait du tort ne manquent pas. Murmurez-le au feu, et le coven se chargera du reste : une rumeur ici, un présent là, un mot discret dans la bonne cuisine."
 witchimproved.1005.a:0 "[hex_candidate_1.GetTitledFirstName]."
 witchimproved.1005.b:0 "[hex_candidate_2.GetTitledFirstName]."
 witchimproved.1005.c:0 "[hex_candidate_3.GetTitledFirstName]."
 witchimproved.1005.d:0 "Quelqu'un d'autre."
 witchimproved.1005.e:0 "Personne. Laissons cela."
 witch_hex_dread_modifier:0 "Malédiction murmurée"
 witch_hex_dread_modifier_desc:0 "Tout le monde semble savoir qu'un coven a maudit ce personnage, et cette crainte le ronge."
 witch_hexed_target_scheme_modifier:0 "Cible envoûtée"
 witch_hexed_target_scheme_modifier_desc:0 "La cible a été affaiblie et troublée par un maléfice."
 witch_hexed_me_opinion:0 "M'a fait jeter un sort"

 witchimproved.1004.t:0 "Chercher un Savoir Interdit"
 witchimproved.1004.desc:0 "Le grimoire devant vous n'est pas un simple recueil de mots — c’est une relique qui murmure. L'écriture change quand vous ne regardez pas, et au coin de votre regard vous entrevoyez des vérités que l'esprit mortel ne devrait pas connaître.\n\nChaque instinct vous ordonne de le fermer, de le rendre à la poussière et aux ténèbres. Pourtant, l'attrait est irrésistible. À chaque page tournée, vous sentez le pouvoir se déployer — une clarté qui promet la maîtrise de votre voie.\n\nMais il y a un danger. Plonger trop profond, c'est inviter la corruption, laisser quelque chose d'étranger s'enrouler dans votre âme. Le prix peut être la santé mentale, la santé, ou pire. Vous pourriez vous retenir, ne glaner que des fragments — plus sûr, mais bien moins gratifiant. Ou… vous pourriez vous abandonner à l'abîme, et voir quels secrets il révèle."
 witchimproved.1004.a:0 "Je saisirai chaque secret, quel qu'en soit le prix."
 witchimproved.1004.b:0 "Je ne prendrai que ce que je peux supporter."
 witchimproved.1004.a.bad:0 "Le grimoire prélève son tribut"
 forbidden_knowledge_risk_tooltip:0 "Quelque chose de mauvais arrive…"
 witchimproved.1004.c:0 "Le lire avec [knowledge_guide.GetFirstNameNoTooltip]."
 witchimproved.1004.good.desc:0 "Le rite s'est bien déroulé, et l'approbation du cercle vous réchauffe encore tandis que vous vous retirez avec le grimoire, les mains fermes.\n\n"
 witchimproved.1004.poor.desc:0 "Le rite a vacillé, et les murmures du cercle résonnent encore à vos oreilles tandis que vous vous retirez avec le grimoire, l'esprit troublé.\n\n"
 witchimproved.1004.brew.desc:0 "\n\nLe breuvage puissant brûle encore dans vos veines. Les lettres dansent sur la page, et vous ne sauriez dire s'il aiguise votre esprit ou le délie."
 witchimproved.1004.guide.desc:0 "\n\n[knowledge_guide.GetTitledFirstName] a déjà lu de tels écrits et propose de parcourir les pages avec vous, lentement et avec soin."
 witch_knowledge_sleepless_modifier:0 "Nuits sans sommeil"
 witch_knowledge_sleepless_modifier_desc:0 "Ce que vous avez lu ne vous laisse pas en paix. Vous restez éveillé à le ressasser, et votre corps en paie le prix."
 witch_knowledge_muddled_modifier:0 "Esprit embrouillé"
 witch_knowledge_muddled_modifier_desc:0 "Des idées à moitié comprises encombrent vos pensées, et votre raisonnement est devenu lent et confus."

# Additional event lines
 witch.3014.g:0 "Expérimenter des méthodes non conventionnelles avec [mystic.GetFirstNameNoTooltip]."
 witch.3014.g.knowledge:0 "[mystic.GetFirstNameNoTooltip] m'apprend quelque chose de nouveau"
 witch.3014.g.inspiration:0 "La conversation est inspirante"

 ### BOONS
 witch_blessing_diplomacy_boon:0 "Leçons de charme"
 witch_blessing_diplomacy_boon_desc:0 "Une nuit de conversation avec un courtisan aguerri a affiné vos manières et votre sens de ce que les gens veulent entendre."
 witch_blessing_health_boon:0 "Régime du guérisseur"
 witch_blessing_health_boon_desc:0 "Un guérisseur du cercle vous a donné des herbes, un régime et de simples conseils, et votre corps s'en porte mieux."
 witch_blessing_learning_boon:0 "Leçons de lettres"
 witch_blessing_learning_boon_desc:0 "Une longue conversation avec un membre érudit du cercle vous a ouvert de nouvelles pistes de réflexion."
 witch_blessing_martial_boon:0 "Leçons de stratégie"
 witch_blessing_martial_boon_desc:0 "Un vieux soldat du cercle a partagé des leçons durement acquises sur l'art de commander et de combattre."
 witch_blessing_intrigue_boon:0 "Leçons d'intrigue"
 witch_blessing_intrigue_boon_desc:0 "Un membre du cercle vous a appris comment on garde les secrets, et comment on les arrache."
 witch_blessing_stewardship_boon:0 "Leçons de commerce"
 witch_blessing_stewardship_boon_desc:0 "Un membre avisé du cercle vous a montré où l'argent se perd et où il se gagne."
 witch_blessing_fertility_boon:0 "Nuit des amants"
 witch_blessing_fertility_boon_desc:0 "Une nuit avec l'être aimé à la belle étoile vous a laissés tous deux rayonnants."
 witch_blessing_allrounder_boon:0 "Sagesse partagée"
 witch_blessing_allrounder_boon_desc:0 "Une nuit de conversation avec tout le cercle vous a rendu un peu plus sage en toute chose, pour un temps."
 witch_curse_weakness:0 "Faiblesse Maudite"
 witch_curse_weakness_desc:0 "Un rite maudit a sapé vos forces, vous laissant affaibli et vulnérable."

 ### TRAITS
 trait_track_witch:0 "Sorcellerie"
 trait_track_witch_desc:0 "La pratique de la sorcellerie et de la magie noire, qui se renforce avec l'expérience et le dévouement au culte."

