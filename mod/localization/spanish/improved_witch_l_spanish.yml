### BREW OPTION
 rite_option_brew:0 "Brebaje"
 rite_brew_none:0 "Sin brebaje"
 rite_brew_none_desc:0 "$EFFECT_LIST_BULLET$ Sin coste ni efecto\n\n#weak Solo el fuego, el círculo y las palabras. Algunos ritos no necesitan más.#!"
 rite_brew_tea:0 "Infusión herbal suave"
 rite_brew_tea_desc:0 "$EFFECT_LIST_BULLET$ Otorga resistencia duradera a las enfermedades y [epidemic_resistance|E] tras el rito\n\n#weak Una infusión caliente de milenrama, corteza de sauce y miel. Nada místico, pero los curanderos populares juran por ella.#!"
 rite_brew_strong:0 "Brebaje alucinógeno fuerte"
 rite_brew_strong_desc:0 "$EFFECT_LIST_BULLET$ Podría curar una [illness|E] o mejorar tu [health|E]\n$EFFECT_LIST_BULLET$ También podría empeorar las cosas\n\n#weak Beleño, hongos y raíces amargas, hervidos hasta que el mundo da vueltas. Nadie sabe cómo te afectará.#!"
 witch_brew_tea_modifier:0 "Infusión herbal"
 witch_brew_tea_modifier_desc:0 "La infusión caliente ha fortalecido tu cuerpo contra la [illness|E]."
 witch_brew_vigor_modifier:0 "Fortalecido por el brebaje"
 witch_brew_vigor_modifier_desc:0 "El brebaje fuerte ha mejorado tu [health|E]: pulso firme y mente despejada."
 witchimproved.1010.t:0 "Una taza compartida"
 witchimproved.1010.desc:0 "Las hierbas reposan en una olla de barro sobre las brasas: milenrama, tomillo, corteza de sauce y miel para suavizar el amargor. Las tazas circulan en silencio por el círculo. No ocurre nada místico, solo calor y una quietud que se asienta en tu pecho. Los viejos curanderos juran que quien la bebe al final de un rito no enferma con facilidad en los años siguientes."
 witchimproved.1010.helper.desc:0 "\n\n[SCOPE.sC('brew_helper').GetTitledFirstName] midió cada ramita a mano y asiente con callada satisfacción mientras terminas tu taza."
 witchimproved.1010.a:0 "Por la buena salud."
 witchimproved.1011.t:0 "Cede la fiebre"
 witchimproved.1011.desc:0 "El brebaje es espeso, repugnante y amargo, y las visiones llegan con fuerza: formas en la luz del fuego, voces en la oscuridad, el suelo cabeceando como un barco. Sudas toda la noche hasta empapar tus ropas. Al despertar al alba, la enfermedad que te aferraba se ha ido. Si fueron las hierbas, el sudor de la fiebre o la pura fe, no sabrías decirlo."
 witchimproved.1011.helper.desc:0 "\n\n[SCOPE.sC('brew_helper').GetTitledFirstName] veló a tu lado, secándote la frente y contando tus respiraciones hasta que pasó lo peor."
 witchimproved.1011.a:0 "Sea cual sea la causa, la enfermedad se ha ido."
 witchimproved.1011.tt:0 "Te has curado de tu [illness|E] tratable más grave"
 witchimproved.1012.t:0 "La mente despejada"
 witchimproved.1012.helper.desc:0 "\n\n[SCOPE.sC('brew_helper').GetTitledFirstName] veló a tu lado, secándote la frente y contando tus respiraciones hasta que pasó lo peor."
 witchimproved.1012.a:0 "Vuelven las fuerzas."
 witch_brew_recovery_modifier:0 "Reconfortado por el brebaje"
 witch_brew_recovery_modifier_desc:0 "El brebaje fuerte no te curó, pero ha mejorado un poco tu [health|E]."
 witch_brew_sickness_modifier:0 "Enfermo por el brebaje"
 witch_brew_sickness_modifier_desc:0 "El brebaje fuerte ha empeorado tu estado y dañado tu [health|E]."
 witch_brew_failed_opinion:0 "Brebaje fallido"
 witchimproved.1013.desc:0 "El brebaje es espeso, repugnante y amargo, y las visiones llegan con fuerza. Sudas toda la noche, pero al alba la enfermedad sigue ahí. Aun así, tu mente está despejada, tu pulso es firme y por un tiempo tu cuerpo se siente capaz de resistir."
 witchimproved.1012.desc:0 "El brebaje es espeso, repugnante y amargo, y las visiones llegan con fuerza. Sudas toda la noche y despiertas al alba agotado pero extrañamente ligero, con el pulso firme y la mente despejada. Por un tiempo tu cuerpo se siente renovado."
 witchimproved.1013.helper.desc:0 "\n\n[SCOPE.sC('brew_helper').GetTitledFirstName] veló a tu lado, secándote la frente y contando tus respiraciones hasta que pasó lo peor."
 witchimproved.1013.t:0 "Una fuerza frágil"
 witchimproved.1013.a:0 "Algo de fuerza es mejor que nada."
 witchimproved.1014.t:0 "El brebaje se tuerce"
 witchimproved.1014.sick.desc:0 "El brebaje es espeso, repugnante y amargo, y las visiones llegan con fuerza, y luego se tuercen: las formas en la luz del fuego se cierran sobre ti, las voces se vuelven chillidos y el suelo no se queda quieto. Pasas la noche enfermo, y al alba la enfermedad te sujeta con más fuerza que antes."
 witchimproved.1014.healthy.desc:0 "El brebaje es espeso, repugnante y amargo, y las visiones llegan con fuerza, y luego se tuercen: las formas en la luz del fuego se cierran sobre ti, las voces se vuelven chillidos y el suelo no se queda quieto. Pasas la noche enfermo y despiertas al alba pálido, temblando y agotado."
 witchimproved.1014.helper.desc:0 "\n\n[SCOPE.sC('brew_helper').GetTitledFirstName] hizo todo lo posible, pero el daño es evidente. Se cruzan palabras duras en la luz gris, y [SCOPE.sC('brew_helper').GetTitledFirstName] se marcha con una mirada fría, culpándote por haber exigido una dosis tan fuerte."
 witchimproved.1014.a:0 "El precio de tal poder."
