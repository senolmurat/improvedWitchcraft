l_french:
 culture_parameter_close_family_better_court_positions: "[aptitude|E] pour le [court_position|El] pour les membres de la [close_family|El] : #P +20#![GetPlayer.Custom('CloseFamilyBetterCourtPositionsCustomLoc')]"
 activity_witch_ritual_selection_tooltip:0 "Adorez [GetPlayer.GetFaith.WitchGodName] et embrassez Son don obscur\n\nRécompenses attendues :\n$BULLET_WITH_TAB$[opinion|E] [opinion_i]\n$BULLET_WITH_TAB$Perte de [stress|El] [stress_loss_i]\n$BULLET_WITH_TAB$Expérience du [trait|E] [GetTrait('witch').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$Une récompense selon votre intention : faveur, point de talent ou [lifestyle_experience|E], ou un maléfice contre un ennemi\n$BULLET_WITH_TAB$[prestige_i][prestige|E] ou [piety_i][piety|E] possibles selon votre culture et votre foi\n$BULLET_WITH_TAB$Les options peuvent apporter une guérison, un bonus de [health|E] ou de la [epidemic_resistance|E]"
 activity_witch_ritual_predicted_cost:0 "Le coût d'un [GetActivityType( 'activity_witch_ritual' ).GetNameNoTooltip] est un montant fixe plus le coût de la cérémonie et du breuvage choisis. Le montant affiché est la moyenne de toutes les options, selon le rang de votre titre et l'époque"
 activity_witch_ritual_host_desc:1 "$BULLET_WITH_TAB$Gain d’[opinion_i] [opinion|E] auprès des invités et perte de [stress_loss_i] [stress|E] pour vous, selon votre cérémonie\n$BULLET_WITH_TAB$Expérience du [trait|E] [GetTrait('witch').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$Une récompense selon votre intention : faveur, point de talent ou [lifestyle_experience|E], ou un maléfice contre un ennemi\n$BULLET_WITH_TAB$Peut vous faire de nouveaux amis ou apprendre un [trait|E] de [lifestyle|E] lors du rassemblement\n$BULLET_WITH_TAB$Votre breuvage peut guérir une [illness|E], améliorer votre [health|E] ou donner de la [epidemic_resistance|E]\n$BULLET_WITH_TAB$Peut rapporter du [prestige_i][prestige|E] ou de la [piety_i][piety|E]"
