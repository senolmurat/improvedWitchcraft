l_spanish:
### INTENTS
 blessing_intent:0 "Buscar Bendición"
 blessing_intent_desc:0 "Aprende de los miembros más hábiles del círculo.\n$EFFECT_LIST_BULLET$Elige un maestro y obtén un don temporal en su campo más fuerte\n$EFFECT_LIST_BULLET$Su duración depende de tu [learning_skill|E], de tu maestro, de cómo fue el rito y de tu experiencia en la brujería\n$EFFECT_LIST_BULLET$El don de un invitado dura la mitad que el del anfitrión"
 curse_enemy_intent:0 "Maldecir Enemigo"
 curse_enemy_intent_desc:0 "Canaliza energías malévolas para maldecir a tus enemigos y rivales con desgracia y debilidad.\n$EFFECT_LIST_BULLET$Puede costar [piety_i][piety|E]\n$EFFECT_LIST_BULLET$El maleficio puede fallar, volverse contra ti o ser rastreado hasta ti."

 forbidden_knowledge_intent:0 "Buscar Conocimiento Prohibido"
 forbidden_knowledge_intent_desc:0 "Profundiza en tomos prohibidos para obtener conocimiento y sabiduría prohibidos. Es arriesgado y no para los débiles de corazón.\n$EFFECT_LIST_BULLET$Puedes ganar un punto de habilidad o [lifestyle_experience|E] en tu [lifestyle|E].\n$EFFECT_LIST_BULLET$Puedes ganar [trait|E]s negativos.\n$EFFECT_LIST_BULLET$#bold Ganarás#! [stress_gain_i|E] [stress|E].\n$BULLET_WITH_TAB$Los personajes con [GetTrait('craven').GetName( GetNullCharacter )] o [GetTrait('paranoid').GetName( GetNullCharacter )] ganarán [stress_gain_i|E] [stress|E] extra.\n$EFFECT_LIST_BULLET$Un [learning_skill|E] alto, la experiencia en la brujería, un rito bien ejecutado y un invitado erudito mejoran tus probabilidades."

### EVENTS
 witchimproved.1001.t:0 "Buscar Bendición"
 witchimproved.1001.desc:0 "Terminada la ceremonia, el círculo se deshace en pequeños corrillos. Este es el verdadero don de un aquelarre: no espíritus ni presagios, sino gente que sabe cosas y está dispuesta a compartirlas. Una noche junto a la persona adecuada enseña más que un año de libros."
 witchimproved.1001.a:0 "Preguntar a [health_expert.GetFirstNameNoTooltip] cómo mantener fuerte mi cuerpo."
 witchimproved.1001.teacher_1:0 "Pedir a [blessing_teacher_1.GetFirstNameNoTooltip] que me instruya en las artes"
 witchimproved.1001.teacher_2:0 "Pedir a [blessing_teacher_2.GetFirstNameNoTooltip] que me instruya en las artes"
 witchimproved.1001.teacher_3:0 "Pedir a [blessing_teacher_3.GetFirstNameNoTooltip] que me instruya en las artes"
 witchimproved.1001.great.t:0 "La lección cala hondo"
 witchimproved.1001.normal.t:0 "Una lección útil"
 witchimproved.1001.poor.t:0 "Poco de ello se queda"
 witchimproved.1001.boon.t:0 "La noche deja su huella"
 witchimproved.1001.already.tt:0 "Ya tienes este don, y la lección de un invitado no le añade nada"
 witchimproved.1002.t:0 "Maldice a tu Enemigo"
 witchimproved.1002.desc.start:0 "La cámara está llena de incienso, el humo se enrosca como serpientes fantasmales mientras el canto de tus seguidores reunidos se convierte en un coro frenético. Las sombras bailan en las paredes, estirándose en formas grotescas que parecen casi vivas.\n\n"
 witchimproved.1002.desc.mid:0 "En el centro, la ofrenda arde: sangre, hierbas y un fragmento de tu propia voluntad, sacrificado a los poderes invisibles que escuchan tu llamada. El velo entre mundos se estremece — y sientes una claridad terrible.\n\n"
 witchimproved.1002.desc.end:0 "Esta noche, el rito exige una víctima. Un alma, un destino, para ser retorcido y arruinado por tu malicia."
 witchimproved.1002.a:0 "Que la mente de [target.GetHerHis] colapse bajo el peso de la desesperación."
 witchimproved.1002.b:0 "Que la enfermedad roa la carne de [target.GetHerHis] hasta que se desmorone."
 witchimproved.1002.c:0 "Una maldición sobre la tierra de [target.GetHerHis], para que la pestilencia ahogue a su pueblo."
 witchimproved.1002.duel.success:0 "El maleficio queda bien echado"
 witchimproved.1002.duel.failure:0 "El maleficio sale mal"
 witchimproved.1002.success.tt:0 "El maleficio se apodera de [target.GetTitledFirstName] en unas semanas"
 witchimproved.1002.failure.tt:0 "El maleficio queda en nada, o se vuelve contra ti"
 witchimproved.1002.discovery.tt:0 "[target.GetTitledFirstName] podría averiguar quién estuvo detrás"
 witchimproved.1002.b.ill.tt:0 "[target.GetTitledFirstName] también podría enfermar"
 witchimproved.1002.c.tt:0 "Estalla una enfermedad en la capital de [target.GetTitledFirstName]"
 witchimproved.1002.c.spread.tt:0 "Puede extenderse más allá de la capital, incluso a tus propias tierras"
 witchimproved.1002.murder.tt:0 "Si el maleficio prende, tu conspiración para asesinar a [target.GetTitledFirstName] tendrá más probabilidades de éxito"
 witchimproved.1003.success.t:0 "Tu maleficio prende"
 witchimproved.1003.fizzle.t:0 "Tu maleficio queda en nada"
 witchimproved.1003.backfire.t:0 "Tu maleficio se vuelve contra ti"
 witchimproved.1003.target.despair.t:0 "Corre la voz de que te han echado una maldición"
 witchimproved.1003.target.sickness.t:0 "Un mal extraño se apodera de ti"
 witchimproved.1003.discovered.t:0 "[target.GetTitledFirstName] descubre que el maleficio era tuyo"
 witchimproved.1003.target.discovered.t:0 "[hexer.GetTitledFirstName] hizo que te echaran un maleficio"
 witchimproved.1005.t:0 "Elige a tu víctima"
 witchimproved.1005.desc:0 "El círculo espera. Un maleficio necesita un nombre, y no faltan quienes te han agraviado. Susúrralo al fuego, y el aquelarre se ocupará del resto: un rumor aquí, un regalo allá, una palabra discreta en la cocina adecuada."
 witchimproved.1005.a:0 "[hex_candidate_1.GetTitledFirstName]."
 witchimproved.1005.b:0 "[hex_candidate_2.GetTitledFirstName]."
 witchimproved.1005.c:0 "[hex_candidate_3.GetTitledFirstName]."
 witchimproved.1005.d:0 "Otra persona."
 witchimproved.1005.e:0 "Nadie. Dejemos el asunto."
 witch_hex_dread_modifier:0 "Maldición susurrada"
 witch_hex_dread_modifier_desc:0 "Todos parecen saber que un aquelarre ha maldecido a este personaje, y ese temor lo carcome."
 witch_hexed_target_scheme_modifier:0 "Objetivo hechizado"
 witch_hexed_target_scheme_modifier_desc:0 "El objetivo ha quedado debilitado e inquieto por un maleficio."
 witch_hexed_me_opinion:0 "Hizo que me echaran un maleficio"

 witchimproved.1004.t:0 "Buscar Conocimiento Prohibido"
 witchimproved.1004.desc:0 "El tomo ante ti no es una mera colección de palabras — es una reliquia que susurra. La escritura se mueve cuando no miras, y en las esquinas de tu vista vislumbras verdades no destinadas a mentes mortales.\n\nCada instinto te dice que lo cierres, que lo consignes de vuelta al polvo y la oscuridad. Sin embargo, la atracción es irresistible. Con cada página que pasas, sientes el poder desplegándose — una claridad que promete maestría sobre tu camino elegido.\n\nPero hay peligro. Profundizar demasiado es invitar a la corrupción, permitir que algo ajeno se enrosque en tu alma. El precio puede ser la cordura, la salud, o algo peor. Podrías contenerse, recogiendo solo fragmentos de sabiduría — seguro, pero mucho menos gratificante. O... podrías entregarte al abismo, y ver qué secretos produce."
 witchimproved.1004.a:0 "Aprehenderé cada secreto, sin importar el costo."
 witchimproved.1004.b:0 "Tomaré solo lo que pueda soportar."
 witchimproved.1004.a.bad:0 "El tomo se cobra su precio"
 forbidden_knowledge_risk_tooltip:0 "Algo malo sucede..."
 witchimproved.1004.c:0 "Leerlo junto a [knowledge_guide.GetFirstNameNoTooltip]."
 witchimproved.1004.good.desc:0 "El rito salió bien, y la aprobación del círculo aún te reconforta mientras te retiras con el tomo, con las manos firmes.\n\n"
 witchimproved.1004.poor.desc:0 "El rito flaqueó, y los murmullos del círculo aún resuenan en tus oídos mientras te retiras con el tomo, con inquietud.\n\n"
 witchimproved.1004.brew.desc:0 "\n\nEl brebaje fuerte aún arde en tus venas. Las letras bailan en la página, y no sabrías decir si afila tu mente o la desata."
 witchimproved.1004.guide.desc:0 "\n\n[knowledge_guide.GetTitledFirstName] ya ha leído escritos así y se ofrece a recorrer las páginas contigo, despacio y con cuidado."
 witch_knowledge_sleepless_modifier:0 "Noches en vela"
 witch_knowledge_sleepless_modifier_desc:0 "Lo que leíste no te deja en paz. Pasas las noches en vela dándole vueltas, y tu cuerpo lo paga."
 witch_knowledge_muddled_modifier:0 "Mente confusa"
 witch_knowledge_muddled_modifier_desc:0 "Ideas a medio entender se agolpan en tus pensamientos, y tu razonamiento se ha vuelto lento y confuso."

 witch.3014.g:0 "Experimentar con métodos no convencionales junto con [mystic.GetFirstNameNoTooltip]."
 witch.3014.g.knowledge:0 "[mystic.GetFirstNameNoTooltip] me enseña algo nuevo"
 witch.3014.g.inspiration:0 "La conversación es inspiradora"

### BOONS
 witch_blessing_diplomacy_boon:0 "Lecciones de encanto"
 witch_blessing_diplomacy_boon_desc:0 "Una noche de conversación con un cortesano experimentado ha afinado tus modales y tu olfato para lo que la gente quiere oír."
 witch_blessing_health_boon:0 "Régimen del sanador"
 witch_blessing_health_boon_desc:0 "Un sanador del círculo te ha dado hierbas, una dieta y consejos sencillos, y tu cuerpo lo agradece."
 witch_blessing_learning_boon:0 "Lecciones de letras"
 witch_blessing_learning_boon_desc:0 "Una larga conversación con un miembro erudito del círculo te ha abierto nuevas líneas de pensamiento."
 witch_blessing_martial_boon:0 "Lecciones de estrategia"
 witch_blessing_martial_boon_desc:0 "Un viejo veterano del círculo ha compartido lecciones ganadas a pulso sobre mandar y combatir."
 witch_blessing_intrigue_boon:0 "Lecciones de intriga"
 witch_blessing_intrigue_boon_desc:0 "Un miembro del círculo te ha enseñado cómo se guardan los secretos y cómo se arrancan."
 witch_blessing_stewardship_boon:0 "Lecciones de comercio"
 witch_blessing_stewardship_boon_desc:0 "Un miembro astuto del círculo te ha mostrado dónde se pierde el dinero y dónde se gana."
 witch_blessing_fertility_boon:0 "Noche de amantes"
 witch_blessing_fertility_boon_desc:0 "Una noche con tu amor bajo el cielo abierto os ha dejado a ambos radiantes."
 witch_blessing_allrounder_boon:0 "Sabiduría compartida"
 witch_blessing_allrounder_boon_desc:0 "Una noche de conversación con todo el círculo te ha hecho un poco más sabio en todo, por un tiempo."
 witch_curse_weakness:0 "Debilidad Maldita"
 witch_curse_weakness_desc:0 "Un rito maldito ha drenado tu fuerza y habilidades, dejándote debilitado y vulnerable."

### TRAITS
 trait_track_witch:0 "Brujería"
 trait_track_witch_desc:0 "La práctica de la brujería y la magia oscura, volviéndose más fuerte con la experiencia y la dedicación al oficio."

