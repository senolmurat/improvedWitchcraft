l_german:
 ### INTENTS
 blessing_intent:0 "Segen suchen"
 blessing_intent_desc:0 "Dunkle Energien kanalisieren, um mächtige Gaben zu erhalten."
 curse_enemy_intent:0 "Feind verfluchen"
 curse_enemy_intent_desc:0 "Böse Energien kanalisieren, um eure Feinde und Rivalen mit Pech und Schwäche zu belegen.\n$EFFECT_LIST_BULLET$Kann [piety_i][piety|E] kosten\n$EFFECT_LIST_BULLET$Der Fluch kann scheitern, auf Euch zurückfallen oder zu Euch zurückverfolgt werden."

 forbidden_knowledge_intent:0 "Verbotenes Wissen suchen"
 forbidden_knowledge_intent_desc:0 "Taucht in verbotene Folianten ein, um verbotenes Wissen und Weisheit zu erlangen. Es ist riskant und nichts für schwache Nerven.\n$EFFECT_LIST_BULLET$Ihr könnt einen Vorteils­punkt oder [lifestyle_experience|E] in eurem [lifestyle|E] erhalten.\n$EFFECT_LIST_BULLET$Ihr könnt negative [trait|E]s erhalten.\n$EFFECT_LIST_BULLET$Ihr #bold werdet#! [stress_gain_i|E] [stress|E] erhalten.\n$BULLET_WITH_TAB$[GetTrait('craven').GetName( GetNullCharacter )]- oder [GetTrait('paranoid').GetName( GetNullCharacter )]-Charaktere erhalten zusätzlich [stress|E].\n$EFFECT_LIST_BULLET$Hohe [learning_skill|E], Erfahrung in der Hexerei, ein gelungener Ritus und ein gelehrter Gast verbessern Eure Chancen."

 ### EVENTS
 witchimproved.1001.t:0 "Segen suchen"
 witchimproved.1001.desc:0 "Die dunklen Energien antworten eurem Ruf, und die Geister der Anderswelt bieten euch ihren Segen. Wählt, welche Art von Gabe ihr von den alten Mächten begehrt."
 witchimproved.1001.a:0 "Lernt etwas Neues von [health_expert.GetFirstNameNoTooltip]."
 witchimproved.1002.t:0 "Verflucht euren Feind"
 witchimproved.1002.desc.start:0 "Der Raum ist dicht mit Weihrauch gefüllt, Rauch kringelt wie geisterhafte Schlangen, während die Gesänge eurer Versammelten zu einem frenetischen Chor anschwellen. Schatten tanzen an den Wänden, dehnen sich zu grotesken Formen, die fast lebendig wirken.\n\n"
 witchimproved.1002.desc.mid:0 "In der Mitte brennt das Opfer: Blut, Kräuter und ein Bruchstück eures eigenen Willens, dargebracht den unsichtbaren Mächten, die euren Ruf hören. Der Schleier zwischen den Welten erzittert – und ihr spürt eine furchtbare Klarheit.\n\n"
 witchimproved.1002.desc.end:0 "Heute Nacht verlangt das Ritual ein Opfer. Eine Seele, ein Schicksal, das durch eure Bosheit verdreht und zerstört wird."
 witchimproved.1002.a:0 "Möge [target.GetHerHis] Geist unter dem Gewicht der Verzweiflung zusammenbrechen."
 witchimproved.1002.b:0 "Möge Krankheit an [target.GetHerHis] Fleisch nagen, bis [target.GetSheHe] zusammenbricht."
 witchimproved.1002.c:0 "Ein Fluch über [target.GetHerHis] Land, damit die Seuche [target.GetHerHis] Volk erstickt."
 witchimproved.1002.duel.success:0 "Der Fluch ist gut gelegt"
 witchimproved.1002.duel.failure:0 "Der Fluch geht schief"
 witchimproved.1002.success.tt:0 "Der Fluch ergreift [target.GetTitledFirstName] binnen Wochen"
 witchimproved.1002.failure.tt:0 "Der Fluch verpufft oder fällt auf Euch zurück"
 witchimproved.1002.discovery.tt:0 "[target.GetTitledFirstName] könnte erfahren, wer dahintersteckt"
 witchimproved.1002.b.ill.tt:0 "[target.GetTitledFirstName] könnte außerdem erkranken"
 witchimproved.1002.c.tt:0 "In der Hauptstadt von [target.GetTitledFirstName] bricht eine Krankheit aus"
 witchimproved.1002.c.spread.tt:0 "Sie kann sich über die Hauptstadt hinaus ausbreiten, sogar in Eure eigenen Lande"
 witchimproved.1002.murder.tt:0 "Wenn der Fluch greift, gelingt Euer Mordkomplott gegen [target.GetTitledFirstName] eher"
 witchimproved.1003.success.t:0 "Euer Fluch greift"
 witchimproved.1003.fizzle.t:0 "Euer Fluch verpufft"
 witchimproved.1003.backfire.t:0 "Euer Fluch fällt auf Euch zurück"
 witchimproved.1003.target.despair.t:0 "Es spricht sich herum, dass man Euch verflucht hat"
 witchimproved.1003.target.sickness.t:0 "Ein seltsames Leiden ergreift Euch"
 witchimproved.1003.discovered.t:0 "[target.GetTitledFirstName] erfährt, dass der Fluch von Euch kam"
 witchimproved.1003.target.discovered.t:0 "[hexer.GetTitledFirstName] ließ Euch verfluchen"
 witchimproved.1005.t:0 "Wählt Euer Opfer"
 witchimproved.1005.desc:0 "Der Kreis wartet. Ein Fluch braucht einen Namen, und an jenen, die Euch Unrecht taten, herrscht kein Mangel. Flüstert ihn ins Feuer, und der Zirkel kümmert sich um den Rest: ein Gerücht hier, ein Geschenk dort, ein leises Wort in der richtigen Küche."
 witchimproved.1005.a:0 "[hex_candidate_1.GetTitledFirstName]."
 witchimproved.1005.b:0 "[hex_candidate_2.GetTitledFirstName]."
 witchimproved.1005.c:0 "[hex_candidate_3.GetTitledFirstName]."
 witchimproved.1005.d:0 "Jemand anderes."
 witchimproved.1005.e:0 "Niemand. Lassen wir es ruhen."
 witch_hex_dread_modifier:0 "Geflüsterter Fluch"
 witch_hex_dread_modifier_desc:0 "Alle scheinen zu wissen, dass ein Zirkel diesen Charakter verflucht hat, und die Furcht davor nagt an ihm."
 witch_hexed_target_scheme_modifier:0 "Verfluchtes Ziel"
 witch_hexed_target_scheme_modifier_desc:0 "Das Ziel wurde durch einen Fluch geschwächt und verunsichert."
 witch_hexed_me_opinion:0 "Ließ mich verfluchen"

 witchimproved.1004.t:0 "Verbotenes Wissen suchen"
 witchimproved.1004.desc:0 "Der Foliant vor euch ist kein bloßes Sammelsurium von Worten – er ist ein Relikt, das flüstert. Die Schrift verändert sich, wenn ihr nicht hinseht, und am Rande eures Blicks erhascht ihr Wahrheiten, die nicht für sterbliche Augen bestimmt sind.\n\nJeder Instinkt sagt euch, ihn zu schließen, ihn dem Staub und der Dunkelheit zurückzugeben. Dennoch ist der Sog unwiderstehlich. Mit jeder umgeschlagenen Seite fühlt ihr Macht sich entfalten – eine Klarheit, die Herrschaft über euren Weg verspricht.\n\nDoch es gibt Gefahr. Zu tief zu tauchen heißt, Verderbnis einzuladen, etwas Fremdes in eure Seele zu lassen. Der Preis kann Verstand, Gesundheit oder Schlimmeres sein. Ihr könntet euch zügeln und nur Splitter aufnehmen – sicherer, aber weit weniger lohnend. Oder… ihr ergebt euch dem Abgrund und seht, welche Geheimnisse er birgt."
 witchimproved.1004.a:0 "Ich werde jedes Geheimnis ergreifen, koste es, was es wolle."
 witchimproved.1004.b:0 "Ich nehme nur, was ich ertragen kann."
 witchimproved.1004.a.bad:0 "Der Foliant fordert seinen Tribut"
 forbidden_knowledge_risk_tooltip:0 "Etwas Schlimmes geschieht…"
 witchimproved.1004.c:0 "Gemeinsam mit [knowledge_guide.GetFirstNameNoTooltip] lesen."
 witchimproved.1004.good.desc:0 "Der Ritus ist gelungen, und die Anerkennung des Kreises wärmt Euch noch, als Ihr Euch mit ruhigen Händen mit dem Folianten zurückzieht.\n\n"
 witchimproved.1004.poor.desc:0 "Der Ritus ist ins Stocken geraten, und das Gemurmel des Kreises klingt Euch noch in den Ohren, als Ihr Euch verunsichert mit dem Folianten zurückzieht.\n\n"
 witchimproved.1004.brew.desc:0 "\n\nDas starke Gebräu brennt noch in Euren Adern. Die Buchstaben verschwimmen auf der Seite, und Ihr könnt nicht sagen, ob es Euren Geist schärft oder löst."
 witchimproved.1004.guide.desc:0 "\n\n[knowledge_guide.GetTitledFirstName] hat solche Schriften schon gelesen und bietet an, die Seiten langsam und sorgfältig mit Euch durchzugehen."
 witch_knowledge_sleepless_modifier:0 "Schlaflose Nächte"
 witch_knowledge_sleepless_modifier_desc:0 "Was Ihr gelesen habt, lässt Euch nicht los. Ihr liegt wach und grübelt, und Euer Körper zahlt den Preis."
 witch_knowledge_muddled_modifier:0 "Verwirrter Geist"
 witch_knowledge_muddled_modifier_desc:0 "Halb verstandene Gedanken drängen sich in Eurem Kopf, und Euer Denken ist langsam und wirr geworden."

# Additional event lines
 witch.3014.g:0 "Mit unkonventionellen Methoden zusammen mit [mystic.GetFirstNameNoTooltip] experimentieren."
 witch.3014.g.knowledge:0 "[mystic.GetFirstNameNoTooltip] bringt mir etwas Neues bei"
 witch.3014.g.inspiration:0 "Das Gespräch ist inspirierend"

 ### BOONS
 witch_blessing_diplomacy_boon:0 "Gab der Diplomatie"
 witch_blessing_diplomacy_boon_desc:0 "Das Ritual hat euch mit gesteigerter Diplomatie und Verhandlungskunst gesegnet und macht euch zu einem Meister des Einflusses."
 witch_blessing_health_boon:0 "Gab der Gesundheit"
 witch_blessing_health_boon_desc:0 "Das Ritual hat euch widerstandsfähiger gegen Krankheit und Plage gemacht."
 witch_blessing_learning_boon:0 "Gab des Wissens"
 witch_blessing_learning_boon_desc:0 "Alte Weisheit fließt durch euch und stärkt eure Lernfähigkeit und kulturelles Verständnis."
 witch_blessing_martial_boon:0 "Gab der Kriegskunst"
 witch_blessing_martial_boon_desc:0 "Das Ritual hat eure kriegerische Stärke erhöht und macht euch zu einem furchtbaren Anführer."
 witch_blessing_intrigue_boon:0 "Gab der Intrige"
 witch_blessing_intrigue_boon_desc:0 "Ihr habt die Kunst der Schatten gemeistert und seid ein Meister der Ränke und Geheimnisse geworden."
 witch_blessing_stewardship_boon:0 "Gab der Verwaltung"
 witch_blessing_stewardship_boon_desc:0 "Mystische Kräfte lenken Wohlstand zu euch und stärken eure wirtschaftlichen und administrativen Fähigkeiten."
 witch_blessing_fertility_boon:0 "Gab der Fruchtbarkeit"
 witch_blessing_fertility_boon_desc:0 "Das Ritual hat euch mit erhöhter Fruchtbarkeit und Vitalität gesegnet, sodass eure Linie gedeiht."
 witch_blessing_allrounder_boon:0 "Gab der Erkenntnis"
 witch_blessing_allrounder_boon_desc:0 "Der Wissensaustausch mit anderen Gästen hat euch eine umfassende, zeitlich begrenzte Verbesserung all eurer Fähigkeiten verliehen."
 witch_curse_weakness:0 "Verfluchte Schwäche"
 witch_curse_weakness_desc:0 "Ein verfluchtes Ritual hat eure Stärke geschwächt und euch verwundbar gemacht."

 ### TRAITS
 trait_track_witch:0 "Hexerei"
 trait_track_witch_desc:0 "Die Praxis der Hexerei und schwarzen Magie, die mit Erfahrung und Hingabe stärker wird."

