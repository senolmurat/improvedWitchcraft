l_korean:
 ### INTENTS
 blessing_intent:0 "축복 추구"
 blessing_intent_desc:0 "원에서 가장 뛰어난 이들에게 배웁니다.\n$EFFECT_LIST_BULLET$스승을 골라 그가 가장 뛰어난 분야의 일시적인 은총을 얻습니다\n$EFFECT_LIST_BULLET$지속 기간은 당신의 [learning_skill|E], 스승, 의식의 성패, 마녀로서의 경험에 달려 있습니다\n$EFFECT_LIST_BULLET$손님의 은총은 주최자의 절반만 지속됩니다"
 curse_enemy_intent:0 "적에게 저주"
 curse_enemy_intent_desc:0 "사악한 힘을 끌어와 적과 경쟁자를 불운과 약화로 저주합니다.\n$EFFECT_LIST_BULLET$[piety_i][piety|E]가 필요할 수 있음\n$EFFECT_LIST_BULLET$저주는 실패하거나, 당신에게 되돌아오거나, 당신의 소행으로 밝혀질 수 있습니다."

 forbidden_knowledge_intent:0 "금지된 지식 추구"
 forbidden_knowledge_intent_desc:0 "금서에 파고들어 금단의 지식과 지혜를 얻습니다. 위험하며, 약한 자에게는 맞지 않습니다.\n$EFFECT_LIST_BULLET$[lifestyle|E]에서 특전 점수나 [lifestyle_experience|E]를 얻을 수 있습니다.\n$EFFECT_LIST_BULLET$부정적인 [trait|E]을 얻을 수 있습니다.\n$EFFECT_LIST_BULLET$#bold 반드시#! [stress_gain_i|E] [stress|E]를 얻습니다.\n$BULLET_WITH_TAB$[GetTrait('craven').GetName( GetNullCharacter )] 또는 [GetTrait('paranoid').GetName( GetNullCharacter )] 특성의 인물은 추가 [stress|E]를 얻습니다.\n$EFFECT_LIST_BULLET$높은 [learning_skill|E], 마녀로서의 경험, 잘 치러진 의식, 그리고 학식 있는 손님이 성공 확률을 높입니다."

 ### EVENTS
 witchimproved.1001.t:0 "축복 추구"
 witchimproved.1001.desc:0 "의식이 끝나자 원은 작은 이야기 무리로 흩어집니다. 이것이야말로 집회의 진짜 선물입니다. 영혼이나 징조가 아니라, 무언가를 알고 기꺼이 나누려는 사람들. 알맞은 이의 곁에서 보낸 하룻밤은 책과 보낸 한 해보다 더 많은 것을 가르칩니다."
 witchimproved.1001.a:0 "[health_expert.GetFirstNameNoTooltip]에게 몸을 튼튼히 지키는 법을 묻는다."
 witchimproved.1001.teacher_1:0 "[blessing_teacher_1.GetFirstNameNoTooltip]에게 지도를 요청해야겠다. 바로..."
 witchimproved.1001.teacher_2:0 "[blessing_teacher_2.GetFirstNameNoTooltip]에게 지도를 요청해야겠다. 바로..."
 witchimproved.1001.teacher_3:0 "[blessing_teacher_3.GetFirstNameNoTooltip]에게 지도를 요청해야겠다. 바로..."
 witchimproved.1001.great.t:0 "배움이 깊이 새겨졌다"
 witchimproved.1001.normal.t:0 "쓸모 있는 가르침"
 witchimproved.1001.poor.t:0 "남은 것이 거의 없다"
 witchimproved.1001.boon.t:0 "그 밤이 흔적을 남겼다"
 witchimproved.1001.already.tt:0 "이미 이 은총을 지니고 있어, 손님으로서 받은 가르침은 아무것도 더하지 못합니다"
 witchimproved.1002.t:0 "적을 저주하라"
 witchimproved.1002.desc.start:0 "방 안은 향으로 가득 차 있으며, 연기가 유령 같은 뱀처럼 소용돌이칩니다. 모인 추종자들의 성가가 광란의 합창으로 치닫고, 벽 위의 그림자들은 거의 살아있는 듯 기괴한 형상으로 춤춥니다.\n\n"
 witchimproved.1002.desc.mid:0 "중앙에 제물이 타오릅니다: 피, 약초, 그리고 당신의 의지 일부가 보이지 않는 존재들에게 바쳐집니다. 세계 사이의 장막이 떨리고 — 당신은 무시무시한 명료함을 느낍니다.\n\n"
 witchimproved.1002.desc.end:0 "오늘 밤, 의식은 희생을 요구합니다. 한 영혼, 한 운명, 당신의 악의로 뒤틀리고 파멸로 이끌 운명입니다."
 witchimproved.1002.a:0 "[target.GetHerHis] 정신이 절망의 무게 아래 무너지기를."
 witchimproved.1002.b:0 "병이 [target.GetHerHis] 육신을 갉아먹어 [target.GetSheHe]가 쓰러지기를."
 witchimproved.1002.c:0 "[target.GetHerHis]의 땅에 저주를 내려, 역병이 [target.GetHerHis] 백성을 질식시키게 하라."
 witchimproved.1002.duel.success:0 "저주가 제대로 걸렸다"
 witchimproved.1002.duel.failure:0 "저주가 어긋났다"
 witchimproved.1002.success.tt:0 "몇 주 안에 저주가 [target.GetTitledFirstName]에게 미칩니다"
 witchimproved.1002.failure.tt:0 "저주가 헛되이 끝나거나 당신에게 되돌아옵니다"
 witchimproved.1002.discovery.tt:0 "[target.GetTitledFirstName]이(가) 배후를 알아낼 수 있습니다"
 witchimproved.1002.b.ill.tt:0 "[target.GetTitledFirstName]이(가) 병에 걸릴 수도 있습니다"
 witchimproved.1002.c.tt:0 "[target.GetTitledFirstName]의 수도에 질병이 발생합니다"
 witchimproved.1002.c.spread.tt:0 "수도 밖으로, 심지어 당신의 영지까지 퍼질 수 있습니다"
 witchimproved.1002.murder.tt:0 "저주가 통하면 [target.GetTitledFirstName]을(를) 노린 당신의 암살 음모가 성공할 가능성이 높아집니다"
 witchimproved.1003.success.t:0 "당신의 저주가 통했습니다"
 witchimproved.1003.fizzle.t:0 "당신의 저주가 헛되이 끝났습니다"
 witchimproved.1003.backfire.t:0 "당신의 저주가 되돌아왔습니다"
 witchimproved.1003.target.despair.t:0 "당신이 저주받았다는 소문이 퍼집니다"
 witchimproved.1003.target.sickness.t:0 "기이한 병이 당신을 덮칩니다"
 witchimproved.1003.discovered.t:0 "[target.GetTitledFirstName]이(가) 저주가 당신의 짓임을 알아냅니다"
 witchimproved.1003.target.discovered.t:0 "[hexer.GetTitledFirstName]이(가) 당신에게 저주를 걸게 했습니다"
 witchimproved.1005.t:0 "희생자를 고르십시오"
 witchimproved.1005.desc:0 "원이 기다립니다. 저주에는 이름이 필요하고, 당신에게 해를 끼친 자는 얼마든지 있습니다. 그 이름을 불 속에 속삭이면 나머지는 집회가 알아서 합니다. 여기에는 소문 하나, 저기에는 선물 하나, 알맞은 부엌에는 조용한 한마디."
 witchimproved.1005.a:0 "[hex_candidate_1.GetTitledFirstName]."
 witchimproved.1005.b:0 "[hex_candidate_2.GetTitledFirstName]."
 witchimproved.1005.c:0 "[hex_candidate_3.GetTitledFirstName]."
 witchimproved.1005.d:0 "다른 사람."
 witchimproved.1005.e:0 "아무도 아니다. 이 일은 묻어 두자."
 witch_hex_dread_modifier:0 "속삭여진 저주"
 witch_hex_dread_modifier_desc:0 "집회가 이 인물을 저주했다는 것을 모두가 아는 듯하며, 그 두려움이 인물을 갉아먹습니다."
 witch_hexed_target_scheme_modifier:0 "저주받은 표적"
 witch_hexed_target_scheme_modifier_desc:0 "표적이 저주로 약해지고 불안해졌습니다."
 witch_hexed_me_opinion:0 "나에게 저주를 걸게 함"

 witchimproved.1004.t:0 "금지된 지식 추구"
 witchimproved.1004.desc:0 "당신 앞의 서적은 단순한 글의 모음이 아닙니다 — 속삭이는 성물입니다. 눈을 돌리면 글자가 변하며, 시야의 가장자리에서 인간이 알아서는 안 될 진실이 스치듯 보입니다.\n\n모든 본능이 책을 덮고 다시 어둠과 먼지로 돌려보내라 말합니다. 하지만 끌림은 거부하기 어렵습니다. 페이지를 넘길 때마다 힘이 펼쳐지고 — 길을 지배할 명료함이 약속됩니다.\n\n하지만 위험이 있습니다. 너무 깊이 파고들면 타락을 초대하고, 낯선 무언가가 당신의 영혼에 스며듭니다. 대가로는 정신, 건강, 혹은 더 나쁜 것을 치를 수 있습니다. 절제하여 파편만 얻을 수도 있습니다 — 더 안전하지만 보상은 적습니다. 아니면… 심연에 몸을 맡기고 그 비밀을 볼 수도 있습니다."
 witchimproved.1004.a:0 "대가가 무엇이든 모든 비밀을 붙잡겠다."
 witchimproved.1004.b:0 "감당할 수 있는 만큼만 취하겠다."
 witchimproved.1004.a.bad:0 "금서가 대가를 거두다"
 forbidden_knowledge_risk_tooltip:0 "나쁜 일이 일어납니다…"
 witchimproved.1004.c:0 "[knowledge_guide.GetFirstNameNoTooltip]와(과) 함께 읽는다."
 witchimproved.1004.good.desc:0 "의식은 순조롭게 끝났고, 금서를 들고 물러나는 당신에게 원의 인정이 아직도 온기로 남아 있습니다. 손은 떨리지 않습니다.\n\n"
 witchimproved.1004.poor.desc:0 "의식은 삐걱거렸고, 금서를 들고 물러나는 당신의 귓가에 원의 수군거림이 아직도 맴돕니다.\n\n"
 witchimproved.1004.brew.desc:0 "\n\n독한 탕약이 아직도 혈관 속에서 타오릅니다. 글자가 책장 위에서 일렁이고, 그것이 정신을 날카롭게 하는지 풀어헤치는지 알 수 없습니다."
 witchimproved.1004.guide.desc:0 "\n\n[knowledge_guide.GetTitledFirstName]은(는) 이런 글을 읽어 본 적이 있어, 천천히 조심스럽게 함께 책장을 넘겨 보자고 제안합니다."
 witch_knowledge_sleepless_modifier:0 "잠 못 이루는 밤"
 witch_knowledge_sleepless_modifier_desc:0 "읽은 내용이 당신을 놓아주지 않습니다. 밤마다 뒤척이며 그것을 곱씹고, 몸이 그 대가를 치릅니다."
 witch_knowledge_muddled_modifier:0 "혼란스러운 정신"
 witch_knowledge_muddled_modifier_desc:0 "반쯤 이해한 생각들이 머릿속을 가득 메워, 사고가 느리고 흐릿해졌습니다."

# Additional event lines
 witch.3014.g:0 "[mystic.GetFirstNameNoTooltip]와 함께 비전통적 방법을 실험한다."
 witch.3014.g.knowledge:0 "[mystic.GetFirstNameNoTooltip]가 새로운 것을 가르쳐 준다"
 witch.3014.g.inspiration:0 "대화가 영감을 준다"

 ### BOONS
 witch_blessing_diplomacy_boon:0 "매력의 가르침"
 witch_blessing_diplomacy_boon_desc:0 "노련한 궁정인과 밤새 나눈 이야기가 당신의 예법과 사람들이 듣고 싶어 하는 말을 읽는 감각을 다듬었습니다."
 witch_blessing_health_boon:0 "치유사의 처방"
 witch_blessing_health_boon_desc:0 "원의 치유사가 약초와 식단, 소박한 조언을 주었고, 몸이 한결 나아졌습니다."
 witch_blessing_learning_boon:0 "학문의 가르침"
 witch_blessing_learning_boon_desc:0 "원의 박식한 일원과 나눈 긴 이야기가 새로운 생각의 길을 열어 주었습니다."
 witch_blessing_martial_boon:0 "전략의 가르침"
 witch_blessing_martial_boon_desc:0 "원의 노병이 지휘와 전투에 대해 힘겹게 얻은 교훈을 나누어 주었습니다."
 witch_blessing_intrigue_boon:0 "계략의 가르침"
 witch_blessing_intrigue_boon_desc:0 "원의 일원이 비밀을 지키는 법과 캐내는 법을 가르쳐 주었습니다."
 witch_blessing_stewardship_boon:0 "상업의 가르침"
 witch_blessing_stewardship_boon_desc:0 "원의 영리한 일원이 돈이 어디서 새고 어디서 벌리는지 보여 주었습니다."
 witch_blessing_fertility_boon:0 "연인의 밤"
 witch_blessing_fertility_boon_desc:0 "탁 트인 하늘 아래 사랑하는 이와 보낸 밤이 두 사람 모두를 빛나게 했습니다."
 witch_blessing_allrounder_boon:0 "나눈 지혜"
 witch_blessing_allrounder_boon_desc:0 "원 전체와 밤새 나눈 이야기가 한동안 모든 면에서 당신을 조금 더 지혜롭게 했습니다."
 witch_curse_weakness:0 "저주의 약화"
 witch_curse_weakness_desc:0 "저주받은 의식이 당신의 힘을 약화시키고 취약하게 만들었습니다."

 ### TRAITS
 trait_track_witch:0 "마술"
 trait_track_witch_desc:0 "마술과 흑마법의 수련으로, 경험과 헌신에 따라 강해집니다."

