l_korean:
 culture_parameter_close_family_better_court_positions: "[close_family|E] 구성원의 [court_position|E] [aptitude|E]: #P +20#![GetPlayer.Custom('CloseFamilyBetterCourtPositionsCustomLoc')]"
 activity_witch_ritual_selection_tooltip:0 "[GetPlayer.GetFaith.WitchGodName](을)를 숭배하고 그분이 내려주시는 어둠의 은총을 받습니다.\n\n예상 보상\n$BULLET_WITH_TAB$[opinion_i] [opinion|E]\n$BULLET_WITH_TAB$[stress_loss_i] [stress|E] 감소\n$BULLET_WITH_TAB$[GetTrait('witch').GetName( GetNullCharacter )] [trait|E] 경험치\n$BULLET_WITH_TAB$선택한 목적에 따른 보상: 은총, 특전 점수 또는 [lifestyle_experience|E], 혹은 적에 대한 저주\n$BULLET_WITH_TAB$문화와 신앙에 따라 [prestige_i][prestige|E] 또는 [piety_i][piety|E]을(를) 얻을 수 있음\n$BULLET_WITH_TAB$선택지에 따라 치유, [health|E] 증가 또는 [epidemic_resistance|E]을(를) 얻을 수 있음"
 activity_witch_ritual_predicted_cost:0 "[GetActivityType( 'activity_witch_ritual' ).GetNameNoTooltip]의 비용은 고정 비용에 선택한 의식과 탕약의 비용을 더한 것입니다. 표시된 금액은 모든 선택지의 평균이며 작위 등급과 시대에 따라 달라집니다"
 activity_witch_ritual_host_desc:1 "$BULLET_WITH_TAB$의식에 따라 손님의 [opinion_i] [opinion|E] 증가 및 [stress_loss_i] [stress|E] 감소\n$BULLET_WITH_TAB$[GetTrait('witch').GetName( GetNullCharacter )] [trait|E] 경험치\n$BULLET_WITH_TAB$선택한 목적에 따른 보상: 은총, 특전 점수 또는 [lifestyle_experience|E], 혹은 적에 대한 저주\n$BULLET_WITH_TAB$모임에서 새 친구를 사귀거나 [lifestyle|E] [trait|E]을(를) 배울 수 있음\n$BULLET_WITH_TAB$탕약으로 [illness|E] 치유, [health|E] 증가 또는 [epidemic_resistance|E]을(를) 얻을 수 있음\n$BULLET_WITH_TAB$[prestige_i][prestige|E] 또는 [piety_i][piety|E]을(를) 얻을 수 있음"
