l_polish:
 ### INTENTS
 blessing_intent:0 "Szukaj Błogosławieństwa"
 blessing_intent_desc:0 "Ucz się od najzdolniejszych członków kręgu.\n$EFFECT_LIST_BULLET$Wybierz nauczyciela i zyskaj tymczasowy dar w jego najmocniejszej dziedzinie\n$EFFECT_LIST_BULLET$Czas trwania zależy od twojej umiejętności ([learning_skill|E]), nauczyciela, przebiegu rytuału i doświadczenia w czarach\n$EFFECT_LIST_BULLET$Dar gościa trwa o połowę krócej niż dar gospodarza"
 curse_enemy_intent:0 "Przeklnij Wroga"
 curse_enemy_intent_desc:0 "Kanalizuj złowrogie energie, by obłożyć wrogów i rywali pechem i słabością.\n$EFFECT_LIST_BULLET$Może kosztować [piety_i][piety|E]\n$EFFECT_LIST_BULLET$Klątwa może zawieść, obrócić się przeciw tobie albo zostać powiązana z tobą."

 forbidden_knowledge_intent:0 "Szukaj Zakazanej Wiedzy"
 forbidden_knowledge_intent_desc:0 "Zanurz się w zakazanych księgach, by posiąść zakazane sekrety i mądrość. To ryzykowne i nie dla słabych.\n$EFFECT_LIST_BULLET$Możesz zyskać punkt atutu lub [lifestyle_experience|E] w swoim [lifestyle|E].\n$EFFECT_LIST_BULLET$Możesz zyskać negatywne [trait|E].\n$EFFECT_LIST_BULLET$#bold Na pewno#! zyskasz [stress_gain_i|E] [stress|E].\n$BULLET_WITH_TAB$Postacie z cechami [GetTrait('craven').GetName( GetNullCharacter )] lub [GetTrait('paranoid').GetName( GetNullCharacter )] zyskają dodatkowy [stress|E].\n$EFFECT_LIST_BULLET$Wysoka umiejętność ([learning_skill|E]), doświadczenie w czarach, dobrze odprawiony rytuał i uczony gość zwiększają twoje szanse."

 ### EVENTS
 witchimproved.1001.t:0 "Szukaj Błogosławieństwa"
 witchimproved.1001.desc:0 "Po ceremonii krąg rozpada się na małe grupki rozmów. To jest prawdziwy dar sabatu: nie duchy ani znaki, lecz ludzie, którzy coś wiedzą i chcą się tym podzielić. Noc spędzona u boku właściwej osoby nauczy więcej niż rok nad księgami."
 witchimproved.1001.a:0 "Zapytaj, jak zachować silne ciało. Doradzi [health_expert.GetFirstNameNoTooltip]."
 witchimproved.1001.teacher_1:0 "Poproś, aby [blessing_teacher_1.GetFirstNameNoTooltip] nauczył[Select_CString(blessing_teacher_1.IsFemale, 'a', '' )] cię sztuki"
 witchimproved.1001.teacher_2:0 "Poproś, aby [blessing_teacher_2.GetFirstNameNoTooltip] nauczył[Select_CString(blessing_teacher_2.IsFemale, 'a', '' )] cię sztuki"
 witchimproved.1001.teacher_3:0 "Poproś, aby [blessing_teacher_3.GetFirstNameNoTooltip] nauczył[Select_CString(blessing_teacher_3.IsFemale, 'a', '' )] cię sztuki"
 witchimproved.1001.great.t:0 "Nauka zapada głęboko"
 witchimproved.1001.normal.t:0 "Pożyteczna lekcja"
 witchimproved.1001.poor.t:0 "Niewiele z tego zostaje"
 witchimproved.1001.boon.t:0 "Ta noc zostawia swój ślad"
 witchimproved.1001.already.tt:0 "Masz już ten dar, a lekcja gościa niczego do niego nie dodaje"
 witchimproved.1002.t:0 "Przeklnij wroga"
 witchimproved.1002.desc.start:0 "Komnata przesycona jest kadzidłem, dym wirował niczym zjawy, gdy śpiewy twoich zgromadzonych wyznawców wznoszą się do gorączkowego chóru. Cienie tańczą po ścianach, wydłużając się w groteskowe kształty, niemal żywe.\n\n"
 witchimproved.1002.desc.mid:0 "W centrum płonie ofiara: krew, zioła i fragment twojej woli, złożone niewidzialnym mocom, które słyszą twoje wezwanie. Zasłona między światami drży — i czujesz przerażającą jasność.\n\n"
 witchimproved.1002.desc.end:0 "Tej nocy rytuał domaga się ofiary. Jednej duszy, jednego losu, który skrzywisz i zniszczysz swoją złośliwością."
 witchimproved.1002.a:0 "Niech umysł [target.GetHerHis] załamie się pod ciężarem rozpaczy."
 witchimproved.1002.b:0 "Niech choroba toczy ciało [target.GetHerHis], aż [target.GetSheHe] runie."
 witchimproved.1002.c:0 "Klątwa na [target.GetHerHis] ziemię, by zaraza dusiła [target.GetHerHis] lud."
 witchimproved.1002.duel.success:0 "Klątwa jest dobrze rzucona"
 witchimproved.1002.duel.failure:0 "Klątwa idzie źle"
 witchimproved.1002.success.tt:0 "W ciągu kilku tygodni klątwa dosięga cel: [target.GetTitledFirstName]"
 witchimproved.1002.failure.tt:0 "Klątwa spełza na niczym albo obraca się przeciw tobie"
 witchimproved.1002.discovery.tt:0 "[target.GetTitledFirstName] może się dowiedzieć, kto za tym stał"
 witchimproved.1002.b.ill.tt:0 "Możliwa jest też choroba ofiary: [target.GetTitledFirstName]"
 witchimproved.1002.c.tt:0 "W stolicy, którą włada [target.GetTitledFirstName], wybucha choroba"
 witchimproved.1002.c.spread.tt:0 "Może rozprzestrzenić się poza stolicę, nawet na twoje własne ziemie"
 witchimproved.1002.murder.tt:0 "Jeśli klątwa zadziała, twój spisek na życie ofiary ([target.GetTitledFirstName]) ma większe szanse powodzenia"
 witchimproved.1003.success.t:0 "Twoja klątwa działa"
 witchimproved.1003.fizzle.t:0 "Twoja klątwa spełza na niczym"
 witchimproved.1003.backfire.t:0 "Twoja klątwa obraca się przeciw tobie"
 witchimproved.1003.target.despair.t:0 "Rozchodzi się wieść, że rzucono na ciebie klątwę"
 witchimproved.1003.target.sickness.t:0 "Ogarnia cię dziwna choroba"
 witchimproved.1003.discovered.t:0 "[target.GetTitledFirstName] dowiaduje się, że klątwa była twoja"
 witchimproved.1003.target.discovered.t:0 "[hexer.GetTitledFirstName] stoi za klątwą rzuconą na ciebie"
 witchimproved.1005.t:0 "Wybierz ofiarę"
 witchimproved.1005.desc:0 "Krąg czeka. Klątwa potrzebuje imienia, a tych, którzy cię skrzywdzili, nie brakuje. Wyszepcz je w ogień, a sabat zajmie się resztą: plotka tu, podarunek tam, ciche słowo we właściwej kuchni."
 witchimproved.1005.a:0 "[hex_candidate_1.GetTitledFirstName]."
 witchimproved.1005.b:0 "[hex_candidate_2.GetTitledFirstName]."
 witchimproved.1005.c:0 "[hex_candidate_3.GetTitledFirstName]."
 witchimproved.1005.d:0 "Ktoś inny."
 witchimproved.1005.e:0 "Nikt. Zostawmy tę sprawę."
 witch_hex_dread_modifier:0 "Szeptana klątwa"
 witch_hex_dread_modifier_desc:0 "Wszyscy zdają się wiedzieć, że sabat przeklął tę postać, a lęk przed tym ją zżera."
 witch_hexed_target_scheme_modifier:0 "Przeklęty cel"
 witch_hexed_target_scheme_modifier_desc:0 "Cel został osłabiony i wytrącony z równowagi przez klątwę."
 witch_hexed_me_opinion:0 "Stoi za klątwą na mnie"

 witchimproved.1004.t:0 "Szukaj Zakazanej Wiedzy"
 witchimproved.1004.desc:0 "Księga przed tobą to nie zbiór słów — to relikwia, która szepcze. Pismo zmienia się, gdy nie patrzysz, a kątem oka dostrzegasz prawdy nie dla śmiertelnych.\n\nKażdy instynkt każe ci ją zamknąć i oddać z powrotem w mrok. Lecz przyciąganie jest nieodparte. Z każdą stroną czujesz, jak rozwija się moc — jasność obiecująca panowanie nad własną drogą.\n\nAle jest i niebezpieczeństwo. Zbyt głębokie zgłębianie to zaproszenie zepsucia, coś obcego wpełza do twojej duszy. Ceną może być rozum, zdrowie, a nawet coś gorszego. Możesz się powstrzymać i zebrać tylko okruchy — bezpieczniej, lecz mniej owocnie. Albo… poddasz się otchłani i zobaczysz, jakie sekrety odsłoni."
 witchimproved.1004.a:0 "Pojmę każdy sekret, bez względu na cenę."
 witchimproved.1004.b:0 "Wezmę tylko tyle, ile zdołam znieść."
 witchimproved.1004.a.bad:0 "Księga zbiera swoje żniwo"
 forbidden_knowledge_risk_tooltip:0 "Wydarzy się coś złego…"
 witchimproved.1004.c:0 "Czytam ją w towarzystwie: [knowledge_guide.GetFirstNameNoTooltip]."
 witchimproved.1004.good.desc:0 "Rytuał się udał, a uznanie kręgu wciąż cię rozgrzewa, gdy pewną ręką zabierasz księgę na ubocze.\n\n"
 witchimproved.1004.poor.desc:0 "Rytuał się zachwiał, a szepty kręgu wciąż dźwięczą ci w uszach, gdy z niepokojem zabierasz księgę na ubocze.\n\n"
 witchimproved.1004.brew.desc:0 "\n\nMocny napar wciąż pali w twoich żyłach. Litery pływają po stronie i nie wiesz, czy wyostrza on twój umysł, czy go rozluźnia."
 witchimproved.1004.guide.desc:0 "\n\n[knowledge_guide.GetTitledFirstName] zna już takie pisma i proponuje przejść przez stronice razem z tobą, powoli i ostrożnie."
 witch_knowledge_sleepless_modifier:0 "Bezsenne noce"
 witch_knowledge_sleepless_modifier_desc:0 "To, co wyczytano, nie daje ci spokoju. Leżysz bezsennie, obracając to w myślach, a ciało za to płaci."
 witch_knowledge_muddled_modifier:0 "Zmącony umysł"
 witch_knowledge_muddled_modifier_desc:0 "Na wpół zrozumiane idee tłoczą się w twoich myślach, a rozumowanie stało się powolne i mętne."

 # Additional event lines
 witch.3014.g:0 "Eksperymentuj z niekonwencjonalnymi metodami razem z [mystic.GetFirstNameNoTooltip]."
 witch.3014.g.knowledge:0 "[mystic.GetFirstNameNoTooltip] uczy mnie czegoś nowego"
 witch.3014.g.inspiration:0 "Rozmowa jest inspirująca"

 ### BOONS
 witch_blessing_diplomacy_boon:0 "Lekcje uroku"
 witch_blessing_diplomacy_boon_desc:0 "Noc rozmów z wytrawnym dworzaninem wygładziła twoje maniery i wyczucie tego, co ludzie chcą usłyszeć."
 witch_blessing_health_boon:0 "Zalecenia uzdrowiciela"
 witch_blessing_health_boon_desc:0 "Uzdrowiciel z kręgu dał ci zioła, dietę i proste rady, a twoje ciało dobrze na tym wychodzi."
 witch_blessing_learning_boon:0 "Lekcje uczoności"
 witch_blessing_learning_boon_desc:0 "Długa rozmowa z uczonym członkiem kręgu otworzyła przed tobą nowe ścieżki myśli."
 witch_blessing_martial_boon:0 "Lekcje strategii"
 witch_blessing_martial_boon_desc:0 "Stary wojak z kręgu podzielił się ciężko zdobytą wiedzą o dowodzeniu i walce."
 witch_blessing_intrigue_boon:0 "Lekcje intryg"
 witch_blessing_intrigue_boon_desc:0 "Członek kręgu nauczył cię, jak strzeże się sekretów i jak się je wydobywa."
 witch_blessing_stewardship_boon:0 "Lekcje handlu"
 witch_blessing_stewardship_boon_desc:0 "Bystry członek kręgu pokazał ci, gdzie pieniądze się marnują, a gdzie można je zarobić."
 witch_blessing_fertility_boon:0 "Noc kochanków"
 witch_blessing_fertility_boon_desc:0 "Noc z ukochaną osobą pod gołym niebem sprawiła, że oboje promieniejecie."
 witch_blessing_allrounder_boon:0 "Wspólna mądrość"
 witch_blessing_allrounder_boon_desc:0 "Noc rozmów z całym kręgiem przydała ci na pewien czas nieco mądrości we wszystkim."
 witch_curse_weakness:0 "Przeklęta Słabość"
 witch_curse_weakness_desc:0 "Przeklęty rytuał osłabił twoje siły i uczynił cię podatnym."

 ### TRAITS
 trait_track_witch:0 "Czarostwo"
 trait_track_witch_desc:0 "Praktyka czarostwa i czarnej magii, rosnąca w siłę wraz z doświadczeniem i oddaniem."

