 tradition_coven_kinship_name:0 "마녀 집회 혈연"
 tradition_coven_kinship_desc:0 "마녀들은 가족의 유대로 묶여 있습니다. 집회에게는 씨족, 혈통이 모든 것입니다."
 culture_parameter_convert_to_witch_close_family_super_bonus: "[close_family|E] 구성원에 대한 $convert_to_witchcraft_interaction$이 거의 항상 #P 성공#!합니다"
