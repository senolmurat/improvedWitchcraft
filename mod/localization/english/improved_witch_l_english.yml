### TRADITIONS
 tradition_occult_practices_name:0 "Occult Practices"
 tradition_occult_practices_desc:0 "Views on magic as a discipline rooted in esoteric knowledge. Its followers believe that through the careful application of rituals, symbols, and incantations found in forbidden lore, one can command the unseen forces of the world. Power is not given, but seized through understanding."
 rulers_with_witch_desc: "The [culture|E] does not have #V 5#! [rulers|E] with [GetTrait('witch').GetName( GetNullCharacter )] [traits|E]"
 culture_parameter_more_frequent_witch_rituals:0 "Delay between [GetActivityType('activity_witch_ritual').GetName] [activities|E] are #P reduced#! by #V 1#! year"
 culture_parameter_easier_to_convert_witch:0 "[characters|E] of this [culture|E] are easier to $convert_to_witchcraft_interaction$"
 culture_parameter_witch_trait_more_valued:3 "[GetTrait('witch').GetName( GetNullCharacter )] [trait|E] is seen as [prestige_i][prestigious|E]\n$EFFECT_LIST_BULLET$Hosting a [GetActivityType('activity_witch_ritual').GetName] earns [prestige_i][prestige|E]"
 easier_to_convert_witch_name:0 "#V [GetCultureTradition('tradition_occult_practices').GetName]#! [tradition|E]"
 easier_to_convert_witch_desc:0 "[GetCultureTradition('tradition_occult_practices').GetName] [tradition|E]: $VALUE|0=-+$"

 tradition_folk_healers_name:0 "Folk Healers"
 tradition_folk_healers_desc:0 "There are those who believe that true healing comes from the union of earth and spirit. Knowledge of herbs mends the flesh, but only the wisdom of the old ways can soothe a troubled soul or ward off unseen blights. Their most respected healers are therefore those who walk both paths, blending practical medicine with the deeper magic of the natural world."
 no_witch_healer_in_realm: "You must have at least one [vassal|E], [courtier|E], or [councillor|E], with [GetTrait('witch').GetName( GetNullCharacter )] and [GetTrait('lifestyle_herbalist').GetName( GetNullCharacter )] [trait|E]s"
 culture_parameter_can_appoint_court_alchemist: "[GetPlayer.Custom('FolkHealersAlchemistCustomLoc')][GetPlayer.Custom('FolkHealersHerbalistCustomLoc')]"
 culture_parameter_easier_herbalist_trait_gain_from_rite:0 "The [GetTrait('lifestyle_herbalist').GetName( GetNullCharacter )] [trait|E] is easier to gain from [GetActivityType('activity_witch_ritual').GetName] [activity|E]"
 culture_parameter_can_gain_mystic_trait_from_rite:0 "Can gain [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )] [trait|E] for attending [GetActivityType('activity_witch_ritual').GetName] [activity|E]"
 can_appoint_court_herbalist: "\n$EFFECT_LIST_BULLET$Can appoint [GetCourtPositionType( 'court_herbalist_court_position' ).GetName()] [court_position|E]"
 can_appoint_court_alchemist: "Can appoint [GetCourtPositionType( 'court_alchemist_court_position' ).GetName()] [court_position|E]"
 culture_parameter_slightly_cheaper_court_physician: "A [GetCourtPositionType('court_physician_court_position').GetName()] costs slightly less to hire"

 tradition_coven_kinship_name:0 "Coven Kinship"
 tradition_coven_kinship_desc:0 "Witches are bound by family ties. For the coven, the clan, the bloodline is everything."
 culture_parameter_convert_to_witch_close_family_super_bonus: "$convert_to_witchcraft_interaction$ on [close_family|E] members almost always #P succeeds#!"
 convert_to_witch_close_family_super_bonus_name: "#V [GetCultureTradition('tradition_coven_kinship').GetName]#! [tradition|E]"
 convert_to_witch_close_family_super_bonus_desc: "[GetCultureTradition('tradition_coven_kinship').GetName] [tradition|E]: $VALUE|0=-+$"
 culture_parameter_more_grand_rite_guest_join_chance:0 "Increases [activity_guests|E] join acceptance for [GetActivityType('activity_witch_ritual').GetName] [activity|E]"
 more_grand_rite_guest_join_chance_desc: "[GetCultureTradition('tradition_coven_kinship').GetName] [tradition|E]: $VALUE|0=-+$"

 tradition_blessed_protection_name:0 "Blessed Protection"
 tradition_blessed_protection_desc:0 "Soldiers march into battle girded with charms and wards, trusting in unseen powers to shield them from blade and arrow. To them, victory is not only won by steel, but by the blessings carried upon their person."

 tradition_coven_meet_name:0 "Coven Meetings"
 tradition_coven_meet_desc:0 "Power is bound not to bloodline alone, but to the secret counsel of witches who gather in shadowed circles. Through whispered bargains and ritual oaths, rulers are chosen by the coven, their authority sanctified by occult consensus rather than mere inheritance."
 culture_parameter_coven_elective_enabled:0 "Can enact the [GetLaw('coven_elective_succession_law').GetName] [succession_law|E]"
 culture_parameter_negate_diplomacy_penalty_for_witch_trait:0 "Removes [diplomacy|E] skill penalty from [GetTrait('witch').GetName( GetNullCharacter )] [trait|E]"

 GENERIC_DONT_STACK:0 "#Weak  (Does not stack)#!"

### DOCTRINES
 doctrine_witchcraft_worshipped_name:0 "Worshipped"
 doctrine_witchcraft_worshipped_desc:0 "True power is not found in solitude, but in the shared will of the coven. We believe that our strength is magnified when we gather, and our most sacred rites bind us together as a spiritual family."
 doctrine_parameter_piety_from_witch_coven_active: "Hosting a [GetActivityType('activity_witch_ritual').GetName] earns [piety_i][piety|E]"
 doctrine_parameter_shorten_witch_coven_cooldown_active: "Delay between [GetActivityType('activity_witch_ritual').GetName] [activities|E] are #P reduced#! by #V 1#! year"
 doctrine_parameter_witchcraft_rejecting_faiths: "Witchcraft Criminal or Shunned [faiths|E]"
 doctrine_parameter_witchcraft_worshipped_faiths: "Witchcraft Worshipped [faiths|E]"
 doctrine_parameter_witchcraft_worshipped_faiths_opinion_active: "$VALUE|+=0$ [opinion|E] with Witchcraft Worshipped [faiths|E]"
 doctrine_parameter_witchcraft_rejecting_faiths_opinion_active: "$VALUE|+=0$ [opinion|E] with Witchcraft Criminal or Shunned [faiths|E]"

 witchcraft_rejecting_faiths_opinion_name: "Witchcraft Rejecting [faiths|E] [opinion|E]"
 witchcraft_rejecting_faiths_county_opinion_name: "$witchcraft_rejecting_faiths_opinion_name$"
 witchcraft_worshipped_faiths_opinion_name: "Witchcraft Worshipped [faiths|E] [opinion|E]"
 witchcraft_worshipped_faiths_county_opinion_name: "$witchcraft_worshipped_faiths_opinion_name$"

### ACTIVITY OPTIONS
 rite_ceremony_conditional_minor_piety_loc: "\n$EFFECT_LIST_BULLET$ Minor [piety_i][piety|E] gain"
 rite_ceremony_conditional_moderate_piety_loc: "\n$EFFECT_LIST_BULLET$ Increased [piety_i][piety|E] gain"
 rite_ceremony_conditional_major_piety_loc: "\n$EFFECT_LIST_BULLET$ Greatly increased [piety_i][piety|E] gain"
 rite_ceremony_conditional_minor_prestige_loc: "\n$EFFECT_LIST_BULLET$ Minor [prestige_i][prestige|E] gain"
 rite_ceremony_conditional_moderate_prestige_loc: "\n$EFFECT_LIST_BULLET$ Increased [prestige_i][prestige|E] gain"
 rite_ceremony_conditional_major_prestige_loc: "\n$EFFECT_LIST_BULLET$ Greatly increased [prestige_i][prestige|E] gain"
 rite_option_ceremony: "Ceremonials"
 rite_ceremony_bad: "Humble Ceremonials"
 rite_ceremony_bad_desc: "$EFFECT_LIST_BULLET$ Small [opinion|E] gain with guests\n$EFFECT_LIST_BULLET$ Minor [stress_loss_i|E][stress|E] loss[GetPlayer.Custom('WillGetMinorPrestigeCustomLoc')]\n\n#weak The rite is not a performance for the uninitiated. We shall gather in secret, our tools humble and our voices low, for true power lies not in spectacle, but in the quiet communion of the faithful.#!"
 rite_ceremony_normal: "Dignified Ceremonials"
 rite_ceremony_normal_desc: "$EFFECT_LIST_BULLET$ Moderate [opinion|E] gain with guests\n$EFFECT_LIST_BULLET$ Moderate [stress_loss_i|E][stress|E] loss[GetPlayer.Custom('WillGetModeratePrestigeCustomLoc')]\n\n#weak The old powers deserve their due, and our traditions must be honored with reverence. We shall procure the proper reagents and prepare the sacred space, for a rite performed with respect is a rite of true power.#!"
 rite_ceremony_good: "Extravagant Ceremonials"  
 rite_ceremony_good_desc: "$EFFECT_LIST_BULLET$ Great [opinion|E] gain with guests\n$EFFECT_LIST_BULLET$ Major [stress_loss_i|E][stress|E] loss[GetPlayer.Custom('WillGetMajorPrestigeCustomLoc')]\n\n#weak No expense shall be spared; the rarest artifacts shall be our focus, the most potent offerings our tribute. Let this Grand Rite be a testament to our ambition, a ceremony so grand that the very stars will bear witness to our power.#!"

### BREW OPTION
 rite_option_brew:0 "Brew"
 rite_brew_none:0 "No Brew"
 rite_brew_none_desc:0 "$EFFECT_LIST_BULLET$ No cost and no effect\n\n#weak Only the fire, the circle and the words. Some rites need nothing more.#!"
 rite_brew_tea:0 "Mild Herbal Tea"
 rite_brew_tea_desc:0 "$EFFECT_LIST_BULLET$ Grants Disease Resistance and [epidemic_resistance|E] after the rite\n\n#weak A warm infusion of yarrow, willow bark and honey. Nothing mystical, but folk healers swear by it.#!"
 rite_brew_strong:0 "Strong Hallucinogenic Brew"
 rite_brew_strong_desc:0 "$EFFECT_LIST_BULLET$ Might cure an [illness|E], or give a boost to your [health|E]\n$EFFECT_LIST_BULLET$ Might also make things worse\n\n#weak Henbane, mushrooms and bitter roots, boiled until the world swims. No one can say how it will take you.#!"
 witch_brew_tea_modifier:0 "Herbal Tea"
 witch_brew_tea_modifier_desc:0 "The warm herbal tea has fortified your body against [illness|E]."
 witch_brew_vigor_modifier:0 "Brew-Fortified"
 witch_brew_vigor_modifier_desc:0 "The strong brew has boosted your [health|E], leaving you with a firm pulse and a clear head."
 witchimproved.1010.t:0 "A Cup Shared"
 witchimproved.1010.desc:0 "Herbs steep in a clay pot over the embers: yarrow, thyme, willow bark, and honey to soften the bitterness. The cups pass around the circle in silence. Nothing mystical happens, only warmth and a quiet that settles in your chest. The old healers swear that whoever drinks it at the end of a rite does not fall ill easily in the years to come."
 witchimproved.1010.helper.desc:0 "\n\n[SCOPE.sC('brew_helper').GetTitledFirstName] measured every sprig by hand and nods with quiet satisfaction as you finish your cup."
 witchimproved.1010.a:0 "To good health."
 witchimproved.1011.t:0 "The Fever Breaks"
 witchimproved.1011.desc:0 "The brew is thick, foul and bitter, and the visions come hard: shapes in the firelight, voices in the dark, the floor tilting like a ship. You sweat through the night until your clothes are soaked. When you wake at dawn, the sickness that had hold of you is gone. Whether it was the herbs, the fever sweat or sheer belief, you cannot say."
 witchimproved.1011.helper.desc:0 "\n\n[SCOPE.sC('brew_helper').GetTitledFirstName] kept vigil at your side, wiping your brow and counting your breaths until the worst had passed."
 witchimproved.1011.a:0 "Whatever the cause, the illness is gone."
 witchimproved.1011.tt:0 "You are cured of your most serious treatable [illness|E]"
 witchimproved.1012.t:0 "A Clear Head"
 witchimproved.1012.helper.desc:0 "\n\n[SCOPE.sC('brew_helper').GetTitledFirstName] kept vigil at your side, wiping your brow and counting your breaths until the worst had passed."
 witchimproved.1012.a:0 "Strength returns."
 witch_brew_recovery_modifier:0 "Brew-Warmed"
 witch_brew_recovery_modifier_desc:0 "The strong brew did not cure you, but it has improved your [health|E] a little."
 witch_brew_sickness_modifier:0 "Brew-Sickened"
 witch_brew_sickness_modifier_desc:0 "The strong brew has worsened your condition and damaged your [health|E]."
 witch_brew_failed_opinion:0 "Botched Brew"
 witchimproved.1013.desc:0 "The brew is thick, foul and bitter, and the visions come hard. You sweat through the night, yet at dawn the illness is still with you. But your head is clear, your pulse is strong, and for a time your body feels able to fight back."
 witchimproved.1012.desc:0 "The brew is thick, foul and bitter, and the visions come hard. You sweat through the night and wake at dawn drained but strangely light, your pulse strong and your head clear. For a time your body feels remade."
 witchimproved.1013.helper.desc:0 "\n\n[SCOPE.sC('brew_helper').GetTitledFirstName] kept vigil at your side, wiping your brow and counting your breaths until the worst had passed."
 witchimproved.1013.t:0 "A Fragile Strength"
 witchimproved.1013.a:0 "A little strength is better than none."
 witchimproved.1014.t:0 "The Brew Turns"
 witchimproved.1014.sick.desc:0 "The brew is thick, foul and bitter, and the visions come hard, then turn: the shapes in the firelight close in, the voices become shrieks, and the floor will not hold still. You are sick through the night, and at dawn the illness has a firmer grip on you than before."
 witchimproved.1014.healthy.desc:0 "The brew is thick, foul and bitter, and the visions come hard, then turn: the shapes in the firelight close in, the voices become shrieks, and the floor will not hold still. You are sick through the night and wake at dawn pale, shaking and spent."
 witchimproved.1014.helper.desc:0 "\n\n[SCOPE.sC('brew_helper').GetTitledFirstName] did everything that could be done, yet the damage is plain. Sharp words are exchanged in the grey light, and [SCOPE.sC('brew_helper').GetTitledFirstName] leaves with a cold look, blaming you for insisting on so strong a dose."
 witchimproved.1014.a:0 "The cost of such power."
