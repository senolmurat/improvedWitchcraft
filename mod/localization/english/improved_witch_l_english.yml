l_english:
### INTENTS
 blessing_intent:0 "Seek Blessing"
 blessing_intent_desc:0 "Learn from the most skilled members of the circle.\n$EFFECT_LIST_BULLET$Choose a teacher and gain a temporary boon in their strongest field\n$EFFECT_LIST_BULLET$How long it lasts depends on your [learning_skill|E], your teacher, how the rite went and your experience as a witch\n$EFFECT_LIST_BULLET$A guest's boon lasts half as long as the host's"
 curse_enemy_intent:0 "Hex Enemy"
 curse_enemy_intent_desc:0 "Channel malevolent energies to curse your enemies and rivals with misfortune and weakness.\n$EFFECT_LIST_BULLET$May cost [piety_i][piety|E]\n$EFFECT_LIST_BULLET$The hex can fail, turn back on you, or be traced to you."

 forbidden_knowledge_intent:0 "Seek Forbidden Knowledge"
 forbidden_knowledge_intent_desc:0 "Delve into forbidden tomes to gain forbidden knowledge and wisdom.It's risky and not for the weak hearted.\n$EFFECT_LIST_BULLET$You might gain a perk point or [lifestyle_experience|E] in your [lifestyle|E].\n$EFFECT_LIST_BULLET$You might gain negative [trait|E]s.\n$EFFECT_LIST_BULLET$You #bold will#! gain [stress_gain_i|E] [stress|E].\n$BULLET_WITH_TAB$[GetTrait('craven').GetName( GetNullCharacter )] or [GetTrait('paranoid').GetName( GetNullCharacter )] characters will gain extra [stress_gain_i|E] [stress|E].\n$EFFECT_LIST_BULLET$Higher [learning_skill|E], experience as a witch, a well-performed rite and a learned guest improve your odds."

### EVENTS
 witchimproved.1001.t:0 "Seek Blessing"
 witchimproved.1001.desc:0 "With the ceremony done, the circle loosens into small knots of talk. This is the real gift of a coven: not spirits or omens, but people who know things and are willing to share them. A night spent at the right elbow can teach more than a year of books."
 witchimproved.1001.a:0 "Ask [health_expert.GetFirstNameNoTooltip] how to keep my body strong."
 witchimproved.1001.teacher_1:0 "Ask [blessing_teacher_1.GetFirstNameNoTooltip] to instruct me in the art of"
 witchimproved.1001.teacher_2:0 "Ask [blessing_teacher_2.GetFirstNameNoTooltip] to instruct me in the art of"
 witchimproved.1001.teacher_3:0 "Ask [blessing_teacher_3.GetFirstNameNoTooltip] to instruct me in the art of"
 witchimproved.1001.great.t:0 "The lesson sinks in deep"
 witchimproved.1001.normal.t:0 "A useful lesson"
 witchimproved.1001.poor.t:0 "Little of it sticks"
 witchimproved.1001.boon.t:0 "The night leaves its mark"
 witchimproved.1001.already.tt:0 "You already carry this boon, and a guest's lesson adds nothing to it"
 witchimproved.1002.t:0 "Hex Your Enemy"
 witchimproved.1002.desc.start:0 "The chamber is thick with incense, smoke curling like ghostly serpents as the chanting of your gathered followers builds into a frenzied chorus. Shadows dance upon the walls, stretching into grotesque shapes that seem almost alive.\n\n"
 witchimproved.1002.desc.mid:0 "At the center, the offering burns: blood, herbs, and a fragment of your own will, sacrificed to the unseen powers that heed your call. The veil between worlds shudders — and you feel a dreadful clarity.\n\n"
 witchimproved.1002.desc.end:0 "Tonight, the rite demands a victim. One soul, one destiny, to be twisted and ruined by your malice."
 witchimproved.1002.a:0 "May [target.GetHerHis] mind collapse beneath the weight of despair."
 witchimproved.1002.b:0 "Let sickness gnaw at [target.GetHerHis] flesh until he crumbles."
 witchimproved.1002.c:0 "A curse upon [target.GetHerHis] land, that pestilence may choke [target.GetHerHis] people."
 witchimproved.1002.duel.success:0 "The hex is well laid"
 witchimproved.1002.duel.failure:0 "The hex goes wrong"
 witchimproved.1002.success.tt:0 "The hex takes hold of [target.GetTitledFirstName] within weeks"
 witchimproved.1002.failure.tt:0 "The hex comes to nothing, or turns back on you"
 witchimproved.1002.discovery.tt:0 "[target.GetTitledFirstName] may learn who was behind it"
 witchimproved.1002.b.ill.tt:0 "[target.GetTitledFirstName] may also fall ill"
 witchimproved.1002.c.tt:0 "Sickness breaks out in the capital of [target.GetTitledFirstName]"
 witchimproved.1002.c.spread.tt:0 "It may spread beyond the capital, even into your own lands"
 witchimproved.1002.murder.tt:0 "If the hex takes hold, your scheme to murder [target.GetTitledFirstName] is more likely to succeed"
 witchimproved.1003.success.t:0 "Your hex takes hold"
 witchimproved.1003.fizzle.t:0 "Your hex comes to nothing"
 witchimproved.1003.backfire.t:0 "Your hex turns back on you"
 witchimproved.1003.target.despair.t:0 "Word spreads that you have been cursed"
 witchimproved.1003.target.sickness.t:0 "A strange sickness takes hold of you"
 witchimproved.1003.discovered.t:0 "[target.GetTitledFirstName] learns the hex was yours"
 witchimproved.1003.target.discovered.t:0 "[hexer.GetTitledFirstName] had a hex laid on you"
 witchimproved.1005.t:0 "Choose Your Victim"
 witchimproved.1005.desc:0 "The circle waits. A hex needs a name, and there is no shortage of those who have wronged you. Whisper it into the fire, and the coven will see to the rest: a rumor here, a gift there, a quiet word in the right kitchen."
 witchimproved.1005.a:0 "[hex_candidate_1.GetTitledFirstName]."
 witchimproved.1005.b:0 "[hex_candidate_2.GetTitledFirstName]."
 witchimproved.1005.c:0 "[hex_candidate_3.GetTitledFirstName]."
 witchimproved.1005.d:0 "Someone else."
 witchimproved.1005.e:0 "No one. Let the matter rest."
 witch_hex_dread_modifier:0 "Whispered Curse"
 witch_hex_dread_modifier_desc:0 "Everyone seems to know that a coven has cursed this character, and the dread of it gnaws at them."
 witch_hexed_target_scheme_modifier:0 "Hexed Target"
 witch_hexed_target_scheme_modifier_desc:0 "The target has been weakened and unsettled by a hex."
 witch_hexed_me_opinion:0 "Had Me Hexed"

 witchimproved.1004.t:0 "Seek Forbidden Knowledge"
 witchimproved.1004.desc:0 "The tome before you is no mere collection of words — it is a relic that whispers. The script shifts when you are not looking, and in the corners of your sight you glimpse truths not meant for mortal minds.\n\nEvery instinct tells you to shut it, to consign it back to dust and darkness. Yet the pull is irresistible. With each page turned, you feel power unfurling — a clarity that promises mastery over your chosen path.\n\nBut there is danger. To delve too deep is to invite corruption, to let something alien coil itself into your soul. The price may be sanity, health, or worse.You could restrain yourself, gleaning only fragments of wisdom — safe, but far less rewarding. Or… you could surrender to the abyss, and see what secrets it yields."
 witchimproved.1004.a:0 "I will grasp every secret, no matter the cost."
 witchimproved.1004.b:0 "I will take only what I can endure."
 witchimproved.1004.a.bad:0 "The tome takes its toll"
 forbidden_knowledge_risk_tooltip:0 "Something bad happens..."
 witchimproved.1004.c:0 "Read it together with [knowledge_guide.GetFirstNameNoTooltip]."
 witchimproved.1004.good.desc:0 "The rite went well, and the circle's approval still warms you as you withdraw with the tome, your hands steady.\n\n"
 witchimproved.1004.poor.desc:0 "The rite faltered, and the murmurs of the circle still ring in your ears as you withdraw with the tome, unsettled.\n\n"
 witchimproved.1004.brew.desc:0 "\n\nThe strong brew still burns in your veins. The letters swim on the page, and you cannot tell whether it sharpens your mind or loosens it."
 witchimproved.1004.guide.desc:0 "\n\n[knowledge_guide.GetTitledFirstName] has read such writings before and offers to go through the pages with you, slowly and with care."
 witch_knowledge_sleepless_modifier:0 "Sleepless Nights"
 witch_knowledge_sleepless_modifier_desc:0 "What you read will not leave you alone. You lie awake turning it over, and your body pays for it."
 witch_knowledge_muddled_modifier:0 "Muddled Mind"
 witch_knowledge_muddled_modifier_desc:0 "Half-understood ideas crowd your thoughts, and your reasoning has grown slow and confused."

 witch.3014.g:0 "Experiment with unconventional methods together with [mystic.GetFirstNameNoTooltip]."
 witch.3014.g.knowledge:0 "[mystic.GetFirstNameNoTooltip] teaches me something new"
 witch.3014.g.inspiration:0 "The conversation is inspiring"

### BOONS
 witch_blessing_diplomacy_boon:0 "Lessons in Charm"
 witch_blessing_diplomacy_boon_desc:0 "A night of talk with a practiced courtier has sharpened your manners and your sense for what people want to hear."
 witch_blessing_health_boon:0 "Healer's Regimen"
 witch_blessing_health_boon_desc:0 "A healer in the circle has given you herbs, a diet and plain advice, and your body is the better for it."
 witch_blessing_learning_boon:0 "Lessons in Letters"
 witch_blessing_learning_boon_desc:0 "Long talk with a learned member of the circle has opened new lines of thought."
 witch_blessing_martial_boon:0 "Lessons in Strategy"
 witch_blessing_martial_boon_desc:0 "An old campaigner in the circle has shared hard-won lessons about leading and fighting."
 witch_blessing_intrigue_boon:0 "Lessons in Scheming"
 witch_blessing_intrigue_boon_desc:0 "A member of the circle has taught you how secrets are kept, and how they are pried loose."
 witch_blessing_stewardship_boon:0 "Lessons in Commerce"
 witch_blessing_stewardship_boon_desc:0 "A shrewd member of the circle has shown you where coin is wasted and where it can be made."
 witch_blessing_fertility_boon:0 "Lovers' Night"
 witch_blessing_fertility_boon_desc:0 "A night with your beloved under the open sky has left you both glowing."
 witch_blessing_allrounder_boon:0 "Shared Wisdom"
 witch_blessing_allrounder_boon_desc:0 "A night of talk with the whole circle has left you a little wiser in everything, for a time."
 witch_curse_weakness:0 "Cursed Weakness"
 witch_curse_weakness_desc:0 "A cursed rite has sapped your strength and abilities, leaving you weakened and vulnerable."

### TRAITS
 trait_track_witch:0 "Witchcraft"
 trait_track_witch_desc:0 "The practice of witchcraft and dark magic, growing stronger with experience and dedication to the craft."

