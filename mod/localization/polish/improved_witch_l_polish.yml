 # DOCTRINES
 doctrine_witchcraft_worshipped_name:0 "Czczona"
 doctrine_witchcraft_worshipped_desc:0 "Prawdziwa moc nie tkwi w samotności, lecz we wspólnej woli sabatu. Wierzymy, że nasza siła mnoży się, gdy się gromadzimy, a nasze najświętsze obrzędy wiążą nas jak duchową rodzinę."

