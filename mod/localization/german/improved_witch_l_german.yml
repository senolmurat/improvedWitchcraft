### BREW OPTION
 rite_option_brew:0 "Gebräu"
 rite_brew_none:0 "Kein Gebräu"
 rite_brew_none_desc:0 "$EFFECT_LIST_BULLET$ Keine Kosten und keine Wirkung\n\n#weak Nur das Feuer, der Kreis und die Worte. Manche Riten brauchen nicht mehr.#!"
 rite_brew_tea:0 "Milder Kräutertee"
 rite_brew_tea_desc:0 "$EFFECT_LIST_BULLET$ Verleiht nach dem Ritus dauerhaft Krankheitsresistenz und [epidemic_resistance|E]\n\n#weak Ein warmer Aufguss aus Schafgarbe, Weidenrinde und Honig. Nichts Mystisches, aber Volksheiler schwören darauf.#!"
 rite_brew_strong:0 "Starkes halluzinogenes Gebräu"
 rite_brew_strong_desc:0 "$EFFECT_LIST_BULLET$ Könnte eine [illness|E] heilen oder Eure [health|E] steigern\n$EFFECT_LIST_BULLET$ Könnte die Lage aber auch verschlimmern\n\n#weak Bilsenkraut, Pilze und bittere Wurzeln, gekocht, bis sich die Welt dreht. Niemand kann sagen, wie es Euch ergreifen wird.#!"
 witch_brew_tea_modifier:0 "Kräutertee"
 witch_brew_tea_modifier_desc:0 "Der warme Kräutertee hat Euren Körper gegen [illness|E] gestärkt."
 witch_brew_vigor_modifier:0 "Vom Gebräu gestärkt"
 witch_brew_vigor_modifier_desc:0 "Das starke Gebräu hat Eure [health|E] gesteigert: kräftiger Puls und klarer Kopf."
 witchimproved.1010.t:0 "Eine geteilte Tasse"
 witchimproved.1010.desc:0 "Kräuter ziehen in einem Tontopf über der Glut: Schafgarbe, Thymian, Weidenrinde und Honig gegen die Bitterkeit. Die Tassen wandern schweigend durch den Kreis. Nichts Mystisches geschieht, nur Wärme und eine Ruhe, die sich in Eurer Brust niederlässt. Die alten Heiler schwören, dass wer ihn am Ende eines Ritus trinkt, in den kommenden Jahren nicht so leicht erkrankt."
 witchimproved.1010.helper.desc:0 "\n\n[SCOPE.sC('brew_helper').GetTitledFirstName] hat jeden Zweig von Hand abgemessen und nickt still zufrieden, als Ihr Eure Tasse leert."
 witchimproved.1010.a:0 "Auf die Gesundheit."
 witchimproved.1011.t:0 "Das Fieber sinkt"
 witchimproved.1011.desc:0 "Das Gebräu ist dick, widerlich und bitter, und die Visionen kommen heftig: Gestalten im Feuerschein, Stimmen in der Dunkelheit, der Boden schwankt wie ein Schiff. Ihr schwitzt die ganze Nacht, bis Eure Kleider durchnässt sind. Als Ihr im Morgengrauen erwacht, hat die Krankheit Euch verlassen. Ob es die Kräuter waren, der Fieberschweiß oder bloßer Glaube, könnt Ihr nicht sagen."
 witchimproved.1011.helper.desc:0 "\n\n[SCOPE.sC('brew_helper').GetTitledFirstName] hielt an Eurer Seite Wache, wischte Euch die Stirn ab und zählte Eure Atemzüge, bis das Schlimmste überstanden war."
 witchimproved.1011.a:0 "Was auch die Ursache war, die Krankheit ist fort."
 witchimproved.1011.tt:0 "Ihr seid von Eurer schwersten behandelbaren [illness|E] geheilt"
 witchimproved.1012.t:0 "Ein klarer Kopf"
 witchimproved.1012.helper.desc:0 "\n\n[SCOPE.sC('brew_helper').GetTitledFirstName] hielt an Eurer Seite Wache, wischte Euch die Stirn ab und zählte Eure Atemzüge, bis das Schlimmste überstanden war."
 witchimproved.1012.a:0 "Die Kraft kehrt zurück."
 witch_brew_recovery_modifier:0 "Vom Gebräu gewärmt"
 witch_brew_recovery_modifier_desc:0 "Das starke Gebräu hat Euch nicht geheilt, aber Eure [health|E] ein wenig verbessert."
 witch_brew_sickness_modifier:0 "Vom Gebräu erkrankt"
 witch_brew_sickness_modifier_desc:0 "Das starke Gebräu hat Euren Zustand verschlimmert und Eure [health|E] geschädigt."
 witch_brew_failed_opinion:0 "Missglücktes Gebräu"
 witchimproved.1013.desc:0 "Das Gebräu ist dick, widerlich und bitter, und die Visionen kommen heftig. Ihr schwitzt die ganze Nacht, doch im Morgengrauen ist die Krankheit noch da. Aber Euer Kopf ist klar, Euer Puls kräftig, und für eine Weile fühlt sich Euer Körper imstande, sich zu wehren."
 witchimproved.1012.desc:0 "Das Gebräu ist dick, widerlich und bitter, und die Visionen kommen heftig. Ihr schwitzt die ganze Nacht und erwacht im Morgengrauen erschöpft, aber seltsam leicht, mit kräftigem Puls und klarem Kopf. Für eine Weile fühlt sich Euer Körper wie neu an."
 witchimproved.1013.helper.desc:0 "\n\n[SCOPE.sC('brew_helper').GetTitledFirstName] hielt an Eurer Seite Wache, wischte Euch die Stirn ab und zählte Eure Atemzüge, bis das Schlimmste überstanden war."
 witchimproved.1013.t:0 "Zerbrechliche Kraft"
 witchimproved.1013.a:0 "Ein wenig Kraft ist besser als keine."
 witchimproved.1014.t:0 "Das Gebräu kippt"
 witchimproved.1014.sick.desc:0 "Das Gebräu ist dick, widerlich und bitter, und die Visionen kommen heftig, dann kippen sie: Die Gestalten im Feuerschein rücken näher, die Stimmen werden zu Schreien, und der Boden will nicht stillhalten. Ihr seid die ganze Nacht krank, und im Morgengrauen hat die Krankheit Euch fester im Griff als zuvor."
 witchimproved.1014.healthy.desc:0 "Das Gebräu ist dick, widerlich und bitter, und die Visionen kommen heftig, dann kippen sie: Die Gestalten im Feuerschein rücken näher, die Stimmen werden zu Schreien, und der Boden will nicht stillhalten. Ihr seid die ganze Nacht krank und erwacht im Morgengrauen bleich, zitternd und erschöpft."
 witchimproved.1014.helper.desc:0 "\n\n[SCOPE.sC('brew_helper').GetTitledFirstName] tat alles, was möglich war, doch der Schaden ist nicht zu übersehen. Im grauen Licht fallen scharfe Worte, und [SCOPE.sC('brew_helper').GetTitledFirstName] geht mit kaltem Blick, weil Ihr auf einer so starken Dosis bestanden habt."
 witchimproved.1014.a:0 "Der Preis solcher Macht."
