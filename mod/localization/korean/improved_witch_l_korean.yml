### BREW OPTION
 rite_option_brew:0 "탕약"
 rite_brew_none:0 "탕약 없음"
 rite_brew_none_desc:0 "$EFFECT_LIST_BULLET$ 비용도 효과도 없음\n\n#weak 오직 불과 원, 그리고 주문뿐. 어떤 의식은 그 이상이 필요하지 않습니다.#!"
 rite_brew_tea:0 "순한 약초차"
 rite_brew_tea_desc:0 "$EFFECT_LIST_BULLET$ 의식 후 지속되는 질병 저항력 및 [epidemic_resistance|E]\n\n#weak 톱풀, 버드나무 껍질, 꿀로 우려낸 따뜻한 차. 신비로울 것은 없지만 민간 치유사들은 이 차를 굳게 믿습니다.#!"
 rite_brew_strong:0 "독한 환각 탕약"
 rite_brew_strong_desc:0 "$EFFECT_LIST_BULLET$ [illness|E]을(를) 치유하거나 [health|E]을(를) 높여줄 수도 있음\n$EFFECT_LIST_BULLET$ 오히려 상태가 악화될 수도 있음\n\n#weak 사리풀, 버섯, 쓴 뿌리를 세상이 빙빙 돌 때까지 끓인 것. 어떻게 작용할지는 아무도 모릅니다.#!"
 witch_brew_tea_modifier:0 "약초차"
 witch_brew_tea_modifier_desc:0 "따뜻한 약초차가 몸을 [illness|E]에 맞서도록 튼튼하게 해주었습니다."
 witch_brew_vigor_modifier:0 "탕약의 기운"
 witch_brew_vigor_modifier_desc:0 "독한 탕약이 [health|E]을(를) 높여 맥박이 힘차고 정신이 맑습니다."
 witchimproved.1010.t:0 "함께 나눈 찻잔"
 witchimproved.1010.desc:0 "토기 단지 속에서 약초가 잉걸불 위에 우러납니다. 톱풀, 백리향, 버드나무 껍질, 그리고 쓴맛을 달래줄 꿀. 찻잔은 말없이 원을 따라 돕니다. 신비로운 일은 일어나지 않고, 가슴에 내려앉는 온기와 고요만이 남습니다. 늙은 치유사들은 의식이 끝날 때 이 차를 마신 이는 이후 몇 해 동안 병에 쉽게 걸리지 않는다고 맹세합니다."
 witchimproved.1010.helper.desc:0 "\n\n[SCOPE.sC('brew_helper').GetTitledFirstName]은(는) 약초 한 줄기까지 손수 재어 넣었고, 당신이 잔을 비우자 조용히 만족스러운 듯 고개를 끄덕입니다."
 witchimproved.1010.a:0 "건강을 위하여."
 witchimproved.1011.t:0 "열이 내리다"
 witchimproved.1011.desc:0 "탕약은 걸쭉하고 고약하며 쓰고, 환각이 거세게 밀려옵니다. 불빛 속의 형체, 어둠 속의 목소리, 배처럼 기우는 바닥. 밤새 옷이 흠뻑 젖도록 땀을 흘리다 새벽에 눈을 뜨니, 당신을 붙들고 있던 병이 사라졌습니다. 약초 덕인지, 열병의 땀 덕인지, 아니면 믿음 덕인지는 알 수 없습니다."
 witchimproved.1011.helper.desc:0 "\n\n[SCOPE.sC('brew_helper').GetTitledFirstName]은(는) 밤새 곁을 지키며 당신의 이마를 닦고 숨을 헤아렸고, 고비가 지나갈 때까지 자리를 뜨지 않았습니다."
 witchimproved.1011.a:0 "이유가 무엇이든, 병은 나았다."
 witchimproved.1011.tt:0 "가장 심각한 치료 가능한 [illness|E]이(가) 치유됩니다"
 witchimproved.1012.t:0 "맑아진 정신"
 witchimproved.1012.helper.desc:0 "\n\n[SCOPE.sC('brew_helper').GetTitledFirstName]은(는) 밤새 곁을 지키며 당신의 이마를 닦고 숨을 헤아렸고, 고비가 지나갈 때까지 자리를 뜨지 않았습니다."
 witchimproved.1012.a:0 "기력이 돌아온다."
 witch_brew_recovery_modifier:0 "탕약으로 데워진 몸"
 witch_brew_recovery_modifier_desc:0 "독한 탕약이 병을 고치지는 못했지만 [health|E]이(가) 조금 나아졌습니다."
 witch_brew_sickness_modifier:0 "탕약에 앓다"
 witch_brew_sickness_modifier_desc:0 "독한 탕약이 상태를 악화시켜 [health|E]이(가) 나빠졌습니다."
 witch_brew_failed_opinion:0 "실패한 탕약"
 witchimproved.1013.desc:0 "탕약은 걸쭉하고 고약하며 쓰고, 환각이 거세게 밀려옵니다. 밤새 땀을 흘렸지만 새벽에도 병은 여전히 곁에 있습니다. 그래도 정신은 맑고 맥박은 힘차며, 한동안은 몸이 병에 맞설 수 있을 것만 같습니다."
 witchimproved.1012.desc:0 "탕약은 걸쭉하고 고약하며 쓰고, 환각이 거세게 밀려옵니다. 밤새 땀을 흘리고 새벽에 지친 채 눈을 뜨지만 몸은 이상하리만치 가볍고, 맥박은 힘차고 정신은 맑습니다. 한동안 몸이 새로 태어난 듯합니다."
 witchimproved.1013.helper.desc:0 "\n\n[SCOPE.sC('brew_helper').GetTitledFirstName]은(는) 밤새 곁을 지키며 당신의 이마를 닦고 숨을 헤아렸고, 고비가 지나갈 때까지 자리를 뜨지 않았습니다."
 witchimproved.1013.t:0 "위태로운 기력"
 witchimproved.1013.a:0 "조금의 기력이라도 없는 것보다 낫다."
 witchimproved.1014.t:0 "탕약이 등을 돌리다"
 witchimproved.1014.sick.desc:0 "탕약은 걸쭉하고 고약하며 쓰고, 환각이 거세게 밀려오다가 이내 돌변합니다. 불빛 속의 형체가 조여 오고, 목소리는 비명이 되며, 바닥은 가만히 있지 않습니다. 밤새 앓다 새벽을 맞으니 병은 전보다 더 깊이 당신을 붙들고 있습니다."
 witchimproved.1014.healthy.desc:0 "탕약은 걸쭉하고 고약하며 쓰고, 환각이 거세게 밀려오다가 이내 돌변합니다. 불빛 속의 형체가 조여 오고, 목소리는 비명이 되며, 바닥은 가만히 있지 않습니다. 밤새 앓다가 새벽에 창백하고 떨리는 몸으로, 기진맥진한 채 눈을 뜹니다."
 witchimproved.1014.helper.desc:0 "\n\n[SCOPE.sC('brew_helper').GetTitledFirstName]은(는) 할 수 있는 모든 것을 했지만, 해악은 분명합니다. 잿빛 새벽빛 속에서 날 선 말이 오가고, [SCOPE.sC('brew_helper').GetTitledFirstName]은(는) 그토록 독한 분량을 고집한 당신을 탓하며 차가운 눈빛으로 자리를 떠납니다."
 witchimproved.1014.a:0 "그런 힘의 대가."
