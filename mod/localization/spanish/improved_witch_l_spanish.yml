### TRADITIONS
 tradition_occult_practices_name:0 "Prácticas Ocultas"
 tradition_occult_practices_desc:0 "Puntos de vista sobre la magia como una disciplina arraigada en el conocimiento esotérico. Sus seguidores creen que a través de la aplicación cuidadosa de rituales, símbolos y encantamientos encontrados en el conocimiento prohibido, uno puede comandar las fuerzas invisibles del mundo. El poder no se da, sino que se toma a través de la comprensión."
 rulers_with_witch_desc: "La [culture|E] no tiene #V 5#! [rulers|E] con [GetTrait('witch').GetName( GetNullCharacter )] [traits|E]"
 culture_parameter_more_frequent_witch_rituals:0 "El retraso entre [GetActivityType('activity_witch_ritual').GetName] [activities|E] es #P reducido#! por #V 1#! año"
 culture_parameter_easier_to_convert_witch:0 "Los [characters|E] de esta [culture|E] son más fáciles de $convert_to_witchcraft_interaction$"
 culture_parameter_witch_trait_more_valued:3 "El [GetTrait('witch').GetName( GetNullCharacter )] [trait|E] es visto como [prestige_i][prestigious|E]\n$EFFECT_LIST_BULLET$Organizar un [GetActivityType('activity_witch_ritual').GetName] gana [prestige_i][prestige|E]"
 easier_to_convert_witch_name:0 "#V [GetCultureTradition('tradition_occult_practices').GetName]#! [tradition|E]"
 easier_to_convert_witch_desc:0 "[GetCultureTradition('tradition_occult_practices').GetName] [tradition|E]: $VALUE|0=-+$"

 tradition_folk_healers_name:0 "Sanadores Populares"
 tradition_folk_healers_desc:0 "Hay quienes creen que la verdadera curación viene de la unión de la tierra y el espíritu. El conocimiento de las hierbas sana la carne, pero solo la sabiduría de los caminos antiguos puede calmar un alma turbada o alejar plagas invisibles. Por lo tanto, sus sanadores más respetados son aquellos que caminan por ambos senderos, mezclando medicina práctica con la magia más profunda del mundo natural."
 no_witch_healer_in_realm: "Debes tener al menos un [vassal|E], [courtier|E] o [councillor|E] con [GetTrait('witch').GetName( GetNullCharacter )] o [GetTrait('lifestyle_herbalist').GetName( GetNullCharacter )] [trait|E]"
 culture_parameter_can_appoint_court_alchemist:0 "[GetPlayer.Custom('FolkHealersAlchemistCustomLoc')][GetPlayer.Custom('FolkHealersHerbalistCustomLoc')]" 
 culture_parameter_easier_herbalist_trait_gain_from_rite:0 "El [GetTrait('lifestyle_herbalist').GetName( GetNullCharacter )] [trait|E] es más fácil de obtener de [GetActivityType('activity_witch_ritual').GetName] [activity|E]"
 culture_parameter_can_gain_mystic_trait_from_rite:0 "Puede obtener [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )] [trait|E] por asistir a [GetActivityType('activity_witch_ritual').GetName] [activity|E]"
 can_appoint_court_herbalist: "\n$EFFECT_LIST_BULLET$Puede nombrar [GetCourtPositionType( 'court_herbalist_court_position' ).GetName()] [court_position|E]"
 can_appoint_court_alchemist: "Puede nombrar [GetCourtPositionType( 'court_alchemist_court_position' ).GetName()] [court_position|E]"
 culture_parameter_slightly_cheaper_court_physician: "[GetCourtPositionType('court_physician_court_position').GetName()] cuesta un poco menos contratar"

 not_spiritual_communal_or_bureaucratic_desc:0 "La [culture|E] no tiene el [ethos|E] $ethos_spiritual_name$, $ethos_communal_name$ o $ethos_bureaucratic_name$"
 lacks_higher_piety_level_desc:1 "Tu [piety_level|E] no es [GetModifier( 'piety_level_4' ).GetNameWithTooltip|L] o superior"

 tradition_coven_kinship_name:0 "Parentesco de Aquelarre"
 tradition_coven_kinship_desc:0 "Las brujas están unidas por lazos familiares—para el aquelarre, el clan, el linaje lo es todo."
 culture_parameter_convert_to_witch_close_family_super_bonus: "$convert_to_witchcraft_interaction$ en miembros de [close_family|E] casi siempre #P tiene éxito#!"
 convert_to_witch_close_family_super_bonus_name: "#V [GetCultureTradition('tradition_coven_kinship').GetName]#! [tradition|E]"
 convert_to_witch_close_family_super_bonus_desc: "[GetCultureTradition('tradition_coven_kinship').GetName] [tradition|E]: $VALUE|0=-+$"
 culture_parameter_more_grand_rite_guest_join_chance:0 "Aumenta la aceptación de [activity_guests|E] para unirse a la [GetActivityType('activity_witch_ritual').GetName] [activity|E]"
 more_grand_rite_guest_join_chance_desc: "[GetCultureTradition('tradition_coven_kinship').GetName] [tradition|E]: $VALUE|0=-+$"

 tradition_blessed_protection_name:0 "Protección Bendita"
 tradition_blessed_protection_desc:0 "Los soldados marchan a la batalla ceñidos con amuletos y protecciones, confiando en poderes invisibles para protegerlos de la hoja y la flecha. Para ellos, la victoria no solo se gana con acero, sino con las bendiciones que llevan consigo."

 tradition_coven_meet_name:0 "Reuniones de Aquelarre"
 tradition_coven_meet_desc:0 "El poder no está ligado solo al linaje, sino al consejo secreto de brujas que se reúnen en círculos de sombras. A través de tratos susurrados y juramentos rituales, los gobernantes son elegidos por el aquelarre, su autoridad santificada por consenso oculto en lugar de mera herencia."
 culture_parameter_coven_elective_enabled:0 "Puede promulgar la [GetLaw('coven_elective_succession_law').GetName] [succession_law|E]"
 culture_parameter_negate_diplomacy_penalty_for_witch_trait:0 "Elimina la penalización de habilidad [diplomacy|E] del [GetTrait('witch').GetName( GetNullCharacter )] [trait|E]"

 ### ACTIVITY OPTIONS
 rite_ceremony_conditional_minor_prestige_loc: "\n$EFFECT_LIST_BULLET$ Pequeña ganancia de [prestige_i][prestige|E]"
 rite_ceremony_conditional_moderate_prestige_loc: "\n$EFFECT_LIST_BULLET$ Ganancia aumentada de [prestige_i][prestige|E]"
 rite_ceremony_conditional_major_prestige_loc: "\n$EFFECT_LIST_BULLET$ Ganancia grandemente aumentada de [prestige_i][prestige|E]"
 rite_option_ceremony: "Ceremonias"
 rite_ceremony_bad: "Ceremonias Humildes"
 rite_ceremony_bad_desc: "$EFFECT_LIST_BULLET$ Pequeña ganancia de [opinion|E] con los invitados\n$EFFECT_LIST_BULLET$ Pequeña reducción de [stress_loss_i|E][stress|E][GetPlayer.Custom('WillGetMinorPrestigeCustomLoc')][GetPlayer.Custom('WillGetMinorPietyCustomLoc')]\n\n#weak El rito no es un espectáculo para los profanos. Nos reuniremos en secreto, con herramientas humildes y voces bajas, pues el verdadero poder reside en la comunión silenciosa de los fieles.#!"
 rite_ceremony_normal: "Ceremonias Dignas"
 rite_ceremony_normal_desc: "$EFFECT_LIST_BULLET$ Ganancia moderada de [opinion|E] con los invitados\n$EFFECT_LIST_BULLET$ Reducción moderada de [stress_loss_i|E][stress|E][GetPlayer.Custom('WillGetModeratePrestigeCustomLoc')][GetPlayer.Custom('WillGetModeratePietyCustomLoc')]\n\n#weak Los viejos poderes merecen su debido respeto, y nuestras tradiciones deben honrarse con reverencia. Obtendremos los reactivos apropiados y prepararemos el espacio sagrado; un rito realizado con respeto es un rito de verdadero poder.#!"
 rite_ceremony_good: "Ceremonias Extravagantes"  
 rite_ceremony_good_desc: "$EFFECT_LIST_BULLET$ Gran ganancia de [opinion|E] con los invitados\n$EFFECT_LIST_BULLET$ Gran reducción de [stress_loss_i|E][stress|E][GetPlayer.Custom('WillGetMajorPrestigeCustomLoc')][GetPlayer.Custom('WillGetMajorPietyCustomLoc')]\n\n#weak No se escatimarán gastos; los artefactos más raros serán nuestro foco y las ofrendas más potentes, nuestro tributo. Que este Gran Rito sea testimonio de nuestra ambición, una ceremonia tan grandiosa que hasta las estrellas den fe.#!"

 GENERIC_DONT_STACK:0 "#Weak  (no se acumula)#!"

# DOCTRINES
 doctrine_witchcraft_worshipped_name:0 "Venerada"
 doctrine_witchcraft_worshipped_desc:0 "El verdadero poder no se encuentra en la soledad, sino en la voluntad compartida del aquelarre. Creemos que nuestra fuerza se multiplica cuando nos reunimos, y que nuestros ritos más sagrados nos unen como una familia espiritual."
 doctrine_parameter_piety_from_witch_coven_active:1 "Organizar un [GetActivityType('activity_witch_ritual').GetName] otorga [piety_i][piety|E]"
 doctrine_parameter_shorten_witch_coven_cooldown_active:1 "El intervalo entre [GetActivityType('activity_witch_ritual').GetName] [activities|E] se #P reduce#! en #V 1#! año"
 rite_ceremony_conditional_minor_piety_loc:0 "\n$EFFECT_LIST_BULLET$ Pequeña ganancia de [piety_i][piety|E]"
 rite_ceremony_conditional_moderate_piety_loc:0 "\n$EFFECT_LIST_BULLET$ Mayor ganancia de [piety_i][piety|E]"
 rite_ceremony_conditional_major_piety_loc:0 "\n$EFFECT_LIST_BULLET$ Gran ganancia de [piety_i][piety|E]"

# DOCTRINE PARAMETERS AND OPINIONS (WITCHCRAFT FAITHS)
 doctrine_parameter_witchcraft_rejecting_faiths:0 "Brujería Criminal o Proscrita [faiths|E]"
 doctrine_parameter_witchcraft_worshipped_faiths:0 "Brujería Venerada [faiths|E]"
 doctrine_parameter_witchcraft_worshipped_faiths_opinion_active:0 "$VALUE|+=0$ [opinion|E] con [faiths|E] donde la brujería es venerada"
 doctrine_parameter_witchcraft_rejecting_faiths_opinion_active:0 "$VALUE|+=0$ [opinion|E] con [faiths|E] donde la brujería es criminal o proscrita"
