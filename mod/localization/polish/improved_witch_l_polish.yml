### BREW OPTION
 rite_option_brew:0 "Napar"
 rite_brew_none:0 "Bez naparu"
 rite_brew_none_desc:0 "$EFFECT_LIST_BULLET$ Brak kosztów i brak efektu\n\n#weak Tylko ogień, krąg i słowa. Niektóre rytuały nie potrzebują niczego więcej.#!"
 rite_brew_tea:0 "Łagodna herbata ziołowa"
 rite_brew_tea_desc:0 "$EFFECT_LIST_BULLET$ Trwała odporność na choroby oraz [epidemic_resistance|E] po zakończeniu rytuału\n\n#weak Ciepły napar z krwawnika, kory wierzby i miodu. Nic mistycznego, ale ludowi uzdrowiciele przysięgają na jego skuteczność.#!"
 rite_brew_strong:0 "Mocny napar halucynogenny"
 rite_brew_strong_desc:0 "$EFFECT_LIST_BULLET$ Możliwe skutki: wyleczenie ([illness|E]) albo poprawa ([health|E])\n$EFFECT_LIST_BULLET$ Możliwe jest też pogorszenie stanu\n\n#weak Lulek, grzyby i gorzkie korzenie, gotowane, aż świat zacznie wirować. Nikt nie wie, jak na ciebie podziała.#!"
 witch_brew_tea_modifier:0 "Herbata ziołowa"
 witch_brew_tea_modifier_desc:0 "Ciepła herbata ziołowa wzmocniła twoje ciało przeciw chorobom ([illness|E])."
 witch_brew_vigor_modifier:0 "Wzmocnienie naparem"
 witch_brew_vigor_modifier_desc:0 "Mocny napar wzmocnił twoje zdrowie ([health|E]): silny puls i jasny umysł."
 witchimproved.1010.t:0 "Wspólny kubek"
 witchimproved.1010.desc:0 "Zioła parzą się w glinianym garnku nad żarem: krwawnik, tymianek, kora wierzby i miód łagodzący gorycz. Kubki wędrują w milczeniu po kręgu. Nie dzieje się nic mistycznego, tylko ciepło i cisza, która osiada w twojej piersi. Starzy uzdrowiciele przysięgają, że kto wypije ją na zakończenie rytuału, ten przez następne lata nie choruje łatwo."
 witchimproved.1010.helper.desc:0 "\n\nKażdą gałązkę odmierzono ręcznie, a [SCOPE.sC('brew_helper').GetTitledFirstName] kiwa głową z cichym zadowoleniem, gdy kończysz swój kubek."
 witchimproved.1010.a:0 "Na zdrowie."
 witchimproved.1011.t:0 "Gorączka ustępuje"
 witchimproved.1011.desc:0 "Napar jest gęsty, paskudny i gorzki, a wizje nadchodzą z mocą: kształty w blasku ognia, głosy w ciemności, podłoga kołysząca się jak statek. Pocisz się całą noc, aż ubranie przemaka. Gdy budzisz się o świcie, choroba, która cię trzymała, zniknęła. Czy to zioła, pot gorączki, czy zwykła wiara, nie potrafisz powiedzieć."
 witchimproved.1011.helper.desc:0 "\n\n[SCOPE.sC('brew_helper').GetTitledFirstName] czuwa przy tobie całą noc, ocierając ci czoło i licząc oddechy, aż najgorsze mija."
 witchimproved.1011.a:0 "Cokolwiek było przyczyną, choroba ustąpiła."
 witchimproved.1011.tt:0 "Zostajesz wyleczony z najcięższej uleczalnej choroby ([illness|E])"
 witchimproved.1012.t:0 "Jasny umysł"
 witchimproved.1012.helper.desc:0 "\n\n[SCOPE.sC('brew_helper').GetTitledFirstName] czuwa przy tobie całą noc, ocierając ci czoło i licząc oddechy, aż najgorsze mija."
 witchimproved.1012.a:0 "Siły wracają."
 witch_brew_recovery_modifier:0 "Rozgrzany naparem"
 witch_brew_recovery_modifier_desc:0 "Mocny napar cię nie wyleczył, ale nieco poprawił twoje zdrowie ([health|E])."
 witch_brew_sickness_modifier:0 "Rozchorowany naparem"
 witch_brew_sickness_modifier_desc:0 "Mocny napar pogorszył twój stan i nadwerężył twoje zdrowie ([health|E])."
 witch_brew_failed_opinion:0 "Nieudany napar"
 witchimproved.1013.desc:0 "Napar jest gęsty, paskudny i gorzki, a wizje nadchodzą z mocą. Pocisz się całą noc, lecz o świcie choroba wciąż jest z tobą. Mimo to twój umysł jest jasny, puls silny, a ciało przez pewien czas czuje się na siłach, by walczyć."
 witchimproved.1012.desc:0 "Napar jest gęsty, paskudny i gorzki, a wizje nadchodzą z mocą. Pocisz się całą noc i budzisz się o świcie, czując zmęczenie, ale i dziwną lekkość, z silnym pulsem i jasnym umysłem. Przez pewien czas twoje ciało wydaje się odmienione."
 witchimproved.1013.helper.desc:0 "\n\n[SCOPE.sC('brew_helper').GetTitledFirstName] czuwa przy tobie całą noc, ocierając ci czoło i licząc oddechy, aż najgorsze mija."
 witchimproved.1013.t:0 "Krucha siła"
 witchimproved.1013.a:0 "Odrobina siły to lepiej niż nic."
 witchimproved.1014.t:0 "Napar się odwraca"
 witchimproved.1014.sick.desc:0 "Napar jest gęsty, paskudny i gorzki, a wizje nadchodzą z mocą, po czym się odwracają: kształty w blasku ognia zbliżają się, głosy zmieniają się w krzyki, a podłoga nie chce stać w miejscu. Jesteś chory całą noc, a o świcie choroba trzyma cię mocniej niż przedtem."
 witchimproved.1014.healthy.desc:0 "Napar jest gęsty, paskudny i gorzki, a wizje nadchodzą z mocą, po czym się odwracają: kształty w blasku ognia zbliżają się, głosy zmieniają się w krzyki, a podłoga nie chce stać w miejscu. Jesteś chory całą noc i budzisz się o świcie bez sił, drżąc z wyczerpania."
 witchimproved.1014.helper.desc:0 "\n\nZrobiono wszystko, co się dało, ale szkody są oczywiste. W szarym świetle padają ostre słowa, a [SCOPE.sC('brew_helper').GetTitledFirstName] odchodzi z chłodnym spojrzeniem, obwiniając cię o upór przy tak mocnej dawce."
 witchimproved.1014.a:0 "Cena takiej mocy."
