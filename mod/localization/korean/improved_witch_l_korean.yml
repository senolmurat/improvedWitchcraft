 tradition_blessed_protection_name:0 "축복받은 보호"
 tradition_blessed_protection_desc:0 "병사들은 부적과 보호막으로 무장하고 전장에 나아가며, 보이지 않는 힘이 칼과 화살로부터 자신들을 보호해줄 것이라 믿습니다. 그들에게 승리는 강철뿐만 아니라 몸에 지닌 축복으로 얻는 것입니다."

 tradition_coven_meet_name:0 "마녀 집회 모임"
 tradition_coven_meet_desc:0 "권력은 혈통에만 묶여 있지 않고, 그림자 원에서 모이는 마녀들의 비밀 회의에 묶여 있습니다. 속삭이는 거래와 의식적 맹세를 통해 통치자들이 집회에 의해 선택되며, 그들의 권위는 단순한 상속이 아닌 오컬트적 합의에 의해 신성화됩니다."
 culture_parameter_coven_elective_enabled:0 "[GetLaw('coven_elective_succession_law').GetName] [succession_law|E] 제정 가능"
 culture_parameter_negate_diplomacy_penalty_for_witch_trait:0 "[GetTrait('witch').GetName( GetNullCharacter )] [trait|E]의 [diplomacy|E] 기술 페널티 제거"

### ACTIVITY OPTIONS
 rite_ceremony_conditional_minor_prestige_loc:0 "\n$EFFECT_LIST_BULLET$ 소량의 [prestige_i][prestige|E] 획득"
 rite_ceremony_conditional_moderate_prestige_loc:0 "\n$EFFECT_LIST_BULLET$ 증가한 [prestige_i][prestige|E] 획득"
 rite_ceremony_conditional_major_prestige_loc:0 "\n$EFFECT_LIST_BULLET$ 크게 증가한 [prestige_i][prestige|E] 획득"
 rite_option_ceremony:0 "의식"
 rite_ceremony_bad:0 "소박한 의식"
 rite_ceremony_bad_desc:0 "$EFFECT_LIST_BULLET$ 손님과의 [opinion|E] 소폭 증가\n$EFFECT_LIST_BULLET$ 소량의 [stress_loss_i|E][stress|E] 감소[GetPlayer.Custom('WillGetMinorPrestigeCustomLoc')][GetPlayer.Custom('WillGetMinorPietyCustomLoc')]\n\n#weak 이 의식은 미입문자를 위한 공연이 아닙니다. 우리는 비밀리에 모여, 소박한 도구와 낮은 목소리로, 진정한 힘은 신도들의 고요한 교감에 있음을 보여줄 것입니다.#!"
 rite_ceremony_normal:0 "품위 있는 의식"
 rite_ceremony_normal_desc:0 "$EFFECT_LIST_BULLET$ 손님과의 [opinion|E] 보통 증가\n$EFFECT_LIST_BULLET$ 보통 수준의 [stress_loss_i|E][stress|E] 감소[GetPlayer.Custom('WillGetModeratePrestigeCustomLoc')][GetPlayer.Custom('WillGetModeratePietyCustomLoc')]\n\n#weak 옛 힘은 합당한 예우를 받아야 하며, 우리의 전통은 경외로 기려져야 합니다. 우리는 적절한 재료를 준비하고 성지를 마련할 것입니다. 존중 속에 치러진 의식이야말로 진정한 힘의 의식입니다.#!"
 rite_ceremony_good:0 "화려한 의식"
 rite_ceremony_good_desc:0 "$EFFECT_LIST_BULLET$ 손님과의 [opinion|E] 대폭 증가\n$EFFECT_LIST_BULLET$ 대량의 [stress_loss_i|E][stress|E] 감소[GetPlayer.Custom('WillGetMajorPrestigeCustomLoc')][GetPlayer.Custom('WillGetMajorPietyCustomLoc')]\n\n#weak 비용을 아끼지 않습니다. 가장 희귀한 유물이 우리의 초점이 되고, 가장 강력한 제물이 우리의 공물이 됩니다. 이 대의식이 우리의 야망을 증명하게 하소서 — 별들조차도 증언할 만큼.#!"

 GENERIC_DONT_STACK:0 "#Weak  (중첩되지 않음)#!"

# DOCTRINES
 doctrine_witchcraft_worshipped_name:0 "숭배됨"
 doctrine_witchcraft_worshipped_desc:0 "진정한 힘은 고독이 아닌 집회의 공동 의지에서 나옵니다. 우리는 함께 모일 때 힘이 배가되며, 가장 성스러운 의식이 우리를 영적 가족으로 묶는다고 믿습니다."
