 activity_witch_ritual_selection_tooltip:0 "Worship [GetPlayer.GetFaith.WitchGodName] and embrace [GetPlayer.GetFaith.WitchGodHerHis|U] dark gift\n\nAnticipated Rewards:\n$BULLET_WITH_TAB$[opinion_i] [opinion|E]\n$BULLET_WITH_TAB$[stress_loss_i] [stress|E] Loss\n$BULLET_WITH_TAB$[GetTrait('witch').GetName( GetNullCharacter )] [trait|E] experience\n$BULLET_WITH_TAB$A reward for your chosen intent: a boon, a perk point or [lifestyle_experience|E], or a hex on an enemy\n$BULLET_WITH_TAB$Possible [prestige_i][prestige|E] or [piety_i][piety|E] from your culture and faith\n$BULLET_WITH_TAB$Options can add a cure, a [health|E] boost or [epidemic_resistance|E]"
